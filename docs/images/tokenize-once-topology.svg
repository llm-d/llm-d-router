<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 284" width="1020" height="284" role="img" aria-label="Coordinator and EPP pod topology diagram">
  <defs>
    <style type="text/css">
      .title { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 14px; font-weight: 700; fill: #1f2328; }
      .sub { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 11.5px; font-weight: 400; fill: #4d5562; }
      .pod-label { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 11px; font-weight: 700; fill: #0969da; letter-spacing: 0.3px; }
      .edge-top { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 11.5px; font-weight: 600; fill: #1f2328; }
      .edge-sub { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; font-size: 11px; font-weight: 400; fill: #57606a; }
    </style>
    <marker id="arrow-end" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto">
      <path d="M 0.5 0.8 L 9 4 L 0.5 7.2 Z" fill="#32383f" stroke="#32383f" stroke-width="0.6" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="8" markerHeight="6.5" orient="auto">
      <path d="M 9.5 0.8 L 1 4 L 9.5 7.2 Z" fill="#32383f" stroke="#32383f" stroke-width="0.6" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Light card background for legibility in both light and dark themes -->
  <rect x="1" y="1" width="1018" height="282" rx="10" ry="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Coordinator Pod boundary -->
  <rect x="240" y="16" width="212" height="252" rx="9" ry="9" fill="#f6faff" stroke="#79a6dc" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="254" y="36" class="pod-label">Coordinator Pod</text>

  <!-- Node 1: Client -->
  <rect x="18" y="48" width="130" height="76" rx="7" ry="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="83" y="72" text-anchor="middle" class="title">Client</text>
  <text x="83" y="92" text-anchor="middle" class="sub">HTTP JSON / SSE</text>
  <text x="83" y="108" text-anchor="middle" class="sub">or Token API</text>

  <!-- Node 2a: Go Coordinator -->
  <rect x="258" y="48" width="176" height="76" rx="7" ry="7" fill="#e7f3ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="346" y="72" text-anchor="middle" class="title">Coordinator</text>
  <text x="346" y="92" text-anchor="middle" class="sub">Routing &amp; Pipeline</text>
  <text x="346" y="108" text-anchor="middle" class="sub">Disaggregated P/D State</text>

  <!-- Node 2b: Engine Render Sidecar -->
  <rect x="258" y="182" width="176" height="72" rx="7" ry="7" fill="#f3f0ff" stroke="#6e40c9" stroke-width="1.5"/>
  <text x="346" y="205" text-anchor="middle" class="title">Render Sidecar</text>
  <text x="346" y="224" text-anchor="middle" class="sub">vllm-rs render</text>
  <text x="346" y="240" text-anchor="middle" class="sub">or sglang-render</text>

  <!-- Node 3: Proxy + EPP -->
  <rect x="572" y="48" width="166" height="76" rx="7" ry="7" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="655" y="72" text-anchor="middle" class="title">Proxy + EPP</text>
  <text x="655" y="92" text-anchor="middle" class="sub">Envoy HTTP/2 + ext_proc</text>
  <text x="655" y="108" text-anchor="middle" class="sub">Token &amp; Prefix Scorer</text>

  <!-- Node 4: Model Server -->
  <rect x="836" y="48" width="166" height="76" rx="7" ry="7" fill="#eafbef" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="919" y="72" text-anchor="middle" class="title">Model Server</text>
  <text x="919" y="92" text-anchor="middle" class="sub">vLLM or SGLang (gRPC)</text>
  <text x="919" y="108" text-anchor="middle" class="sub">Encode / Prefill / Decode</text>

  <!-- Edge 1: Client <-> Coordinator -->
  <line x1="151" y1="86" x2="255" y2="86" stroke="#32383f" stroke-width="1.7" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="195" y="76" text-anchor="middle" class="edge-top">HTTP / gRPC</text>
  <text x="195" y="104" text-anchor="middle" class="edge-sub">SSE / Tokens</text>

  <!-- Edge 2: Coordinator <-> Render Sidecar (UDS) -->
  <line x1="346" y1="127" x2="346" y2="179" stroke="#32383f" stroke-width="1.7" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="356" y="150" text-anchor="start" class="edge-top">UDS gRPC</text>
  <text x="356" y="165" text-anchor="start" class="edge-sub">render.sock</text>

  <!-- Edge 3: Coordinator -> Proxy + EPP -->
  <line x1="436" y1="86" x2="569" y2="86" stroke="#32383f" stroke-width="1.7" marker-end="url(#arrow-end)"/>
  <text x="512" y="76" text-anchor="middle" class="edge-top">gRPC Generate</text>
  <text x="512" y="104" text-anchor="middle" class="edge-sub">token IDs + profile</text>

  <!-- Edge 4: Proxy + EPP -> Model Server -->
  <line x1="740" y1="86" x2="833" y2="86" stroke="#32383f" stroke-width="1.7" marker-end="url(#arrow-end)"/>
  <text x="787" y="76" text-anchor="middle" class="edge-top">gRPC Stream</text>
  <text x="787" y="104" text-anchor="middle" class="edge-sub">picked endpoint</text>
</svg>
