# Variant of the qwen3-coder-30b-epp-config ConfigMap that swaps
# kv-cache-hint for kv-cache-hint-v2: retention bounded to the context head
# and to a global protection budget. Apply over epp.yaml's ConfigMap and
# restart the EPP to switch arms:
#
#   kubectl apply -f epp-config-hint-v2.yaml
#   kubectl rollout restart deploy/qwen3-coder-30b-epp
#
# Re-applying epp.yaml switches back.
#
# Sizing for the vllm-qwen3-coder-30b backend (2,196,848-token fp8 KV pool):
# 16384 protected tokens per session, 1,100,000-token budget (~half the
# pool), so 16 concurrent sessions pin at most ~262K tokens and the evictor
# always keeps a majority of the pool in plain LRU order.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-coder-30b-epp-config
data:
  epp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: session-id-producer
      parameters:
        headerName: x-session-id
    # Track main-agent turns only: the patched inference-perf client sends
    # x-session-type: main on main-session turns and no session-type header
    # on subagent requests, so subagents match no queue.
    - type: session-interturn-latency-producer
      parameters:
        sessionTypeHeader: x-session-type
        queues:
        - sessionType: main
          initialLogMean: 2.28
          initialLogStd: 1.34
    - type: kv-cache-hint-v2
      parameters:
        maxProtectedPrefixTokens: 16384
        protectionBudgetTokens: 1100000
        queues:
        - sessionType: main
    - type: inflight-load-producer
    - type: token-load-scorer
    - type: approx-prefix-cache-producer
      parameters:
        maxPrefixTokensToMatch: 262144
        blockSizeTokens: 256
    - type: prefix-cache-affinity-filter
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
