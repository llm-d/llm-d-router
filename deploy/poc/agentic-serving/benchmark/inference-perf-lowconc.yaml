# Low-concurrency benchmark pair: the regime the retention hint targets.
# 8 concurrent sessions keep the live working set (~1.2M tokens) inside the
# 2.2M-token KV pool, so eviction pressure comes from session turnover across
# the 16-session pool; the 60s idle-gap cap doubles the window in which LRU
# can evict an idle main session's head between turns.
#
# Arms (run sequentially, reset the vLLM prefix cache before each):
#   lowconc-baseline: no session headers, plain LRU.
#   lowconc-v2:       patched client + kv-cache-hint-v2 (EPP running
#                     epp-config-hint-v2.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-lowconc-baseline-config
data:
  config.yml: |
    load:
      type: trace_session_replay
      stages:
        - concurrent_sessions: 8
          num_sessions: 16
      num_workers: 8
      worker_max_concurrency: 100
      request_timeout: 600
      base_seed: 20260910
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
      base_url: http://35.208.188.17
    tokenizer:
      pretrained_model_name_or_path: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
    data:
      type: weka_trace_replay
      weka_trace_replay:
        hf_dataset_path: "semianalysisai/cc-traces-weka-with-subagents-060826-256k"
        num_dataset_entries: 20
        use_static_model: true
        static_model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
        default_block_size: 64
        skip_invalid_files: true
        trace_idle_gap_cap_seconds: 60.0
        max_wait_ms: 60000
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
        per_request_fields:
          request: false
          response: false
          response_chunks: false
          info: true
          computed_metrics: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-lowconc-v2-config
data:
  config.yml: |
    load:
      type: trace_session_replay
      stages:
        - concurrent_sessions: 8
          num_sessions: 16
      num_workers: 8
      worker_max_concurrency: 100
      request_timeout: 600
      base_seed: 20260910
    api:
      type: chat
      streaming: true
      session_id_header_key: x-session-id
    server:
      type: vllm
      model_name: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
      base_url: http://35.208.188.17
    tokenizer:
      pretrained_model_name_or_path: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
    data:
      type: weka_trace_replay
      weka_trace_replay:
        hf_dataset_path: "semianalysisai/cc-traces-weka-with-subagents-060826-256k"
        num_dataset_entries: 20
        use_static_model: true
        static_model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
        default_block_size: 64
        skip_invalid_files: true
        trace_idle_gap_cap_seconds: 60.0
        max_wait_ms: 60000
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
        per_request_fields:
          request: false
          response: false
          response_chunks: false
          info: true
          computed_metrics: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-lowconc-baseline
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: inference-perf
        arm: lowconc-baseline
    spec:
      restartPolicy: Never
      containers:
      - name: inference-perf
        image: quay.io/inference-perf/inference-perf:v0.7.0
        command: ["/bin/sh", "-c"]
        args:
        - |
          python inference_perf/main.py --config_file /etc/inference-perf/config.yml
          ec=$?
          for f in $(find /workspace -name '*.json' 2>/dev/null | sort); do
            echo "===REPORT=== $f"
            cat "$f"; echo
          done
          exit $ec
        env:
        - name: HF_HOME
          value: /tmp/hf
        volumeMounts:
        - name: config
          mountPath: /etc/inference-perf
        resources:
          requests:
            cpu: 8
            memory: 24Gi
            ephemeral-storage: 20Gi
          limits:
            memory: 28Gi
            ephemeral-storage: 40Gi
      volumes:
      - name: config
        configMap:
          name: inference-perf-lowconc-baseline-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-lowconc-v2
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: inference-perf
        arm: lowconc-v2
    spec:
      restartPolicy: Never
      containers:
      - name: inference-perf
        image: quay.io/inference-perf/inference-perf:v0.7.0
        command: ["/bin/sh", "-c"]
        args:
        - |
          python inference_perf/main.py --config_file /etc/inference-perf/config.yml
          ec=$?
          for f in $(find /workspace -name '*.json' 2>/dev/null | sort); do
            echo "===REPORT=== $f"
            cat "$f"; echo
          done
          exit $ec
        env:
        - name: HF_HOME
          value: /tmp/hf
        volumeMounts:
        - name: config
          mountPath: /etc/inference-perf
        - name: client-patch
          mountPath: /workspace/inference_perf/client/modelserver/openai_client.py
          subPath: openai_client.py
        - name: client-patch
          mountPath: /workspace/.venv/lib/python3.12/site-packages/inference_perf/client/modelserver/openai_client.py
          subPath: openai_client.py
        resources:
          requests:
            cpu: 8
            memory: 24Gi
            ephemeral-storage: 20Gi
          limits:
            memory: 28Gi
            ephemeral-storage: 40Gi
      volumes:
      - name: config
        configMap:
          name: inference-perf-lowconc-v2-config
      - name: client-patch
        configMap:
          name: inference-perf-client-patch
