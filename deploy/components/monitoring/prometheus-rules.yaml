# Alerting rules for the EPP's KV-cache index, KV-event stream, and request path.
#
# This PrometheusRule is the single source for these alerts. For a Prometheus
# that is not managed by prometheus-operator, extract the bare rule groups:
#
#   yq '.spec' deploy/components/monitoring/prometheus-rules.yaml > kvcache-alerts.rules.yml
#
# The kv_cache_* series exist only when the precise prefix cache runs with
# indexerConfig.kvBlockIndexConfig.enableMetrics: true; the llm_d_epp_request_*
# series are always emitted. Alerts on absent series simply never fire.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kvcache-alerts
  labels:
    app: llm-d-router
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: kvcache.rules
      rules:
        # A cold index, a block size that disagrees with the model server, or a
        # broken event stream all show up as lookups that stop matching.
        - alert: KVCacheLowIndexHitRatio
          expr: |
            (
              rate(llm_d_router_epp_kv_cache_index_lookup_hits_total[5m])
              /
              rate(llm_d_router_epp_kv_cache_index_lookup_requests_total[5m])
            ) < 0.3
            and
            rate(llm_d_router_epp_kv_cache_index_lookup_requests_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "KV-cache index hit ratio below 30%"
            description: >-
              The KV-cache index hit ratio has been below 30% for 10 minutes
              while lookups are still occurring. The index may be cold, mis-sized,
              or experiencing hash collisions.

        - alert: KVCacheHighLookupLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le, instance) (
                rate(llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "KV-cache index P99 lookup latency exceeds 500ms"
            description: >-
              The 99th percentile KV-cache index lookup latency has exceeded
              500ms for 5 minutes. This adds scheduling overhead and may indicate
              an overloaded or under-provisioned index backend.

        # The 1h baseline is offset by the alert window so a sustained spike does
        # not raise the baseline it is compared against.
        - alert: KVCacheAbnormalEvictionSpike
          expr: |
            rate(llm_d_router_epp_kv_cache_index_evictions_total[5m])
            >
            5 * avg_over_time(
              rate(llm_d_router_epp_kv_cache_index_evictions_total[5m])[1h:1m] offset 10m
            )
            and
            rate(llm_d_router_epp_kv_cache_index_evictions_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "KV-cache eviction rate spiked to 5x baseline"
            description: >-
              The KV-cache block eviction rate has exceeded 5 times its 1-hour
              moving average for 10 minutes. This may indicate memory pressure or
              a sudden workload shift invalidating cached blocks.

        - alert: KVCacheSubscriberReconnecting
          expr: |
            rate(llm_d_router_epp_kv_cache_events_subscriber_reconnections_total[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "KV-cache event subscriber is reconnecting"
            description: >-
              A ZMQ event subscriber has been reconnecting at a sustained rate
              for 10 minutes. The index may be stale because events are being
              dropped. Check network connectivity to the model-server pod.

        - alert: KVCacheEventPoolSaturated
          expr: |
            llm_d_router_epp_kv_cache_events_pool_queue_depth
            /
            llm_d_router_epp_kv_cache_events_pool_capacity
            > 0.8
            and
            llm_d_router_epp_kv_cache_events_pool_capacity > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "KV-cache event pool queue depth exceeds 80% of capacity"
            description: >-
              The event processing pool queue is more than 80% full for
              5 minutes. The EPP may not be keeping up with the KV-cache event
              stream. Consider increasing the worker shard count.

    - name: epp.rules
      rules:
        # Grouping keeps one alert per model and streaming mode. The raw series
        # also carry fairness_id, which is bounded at 1000 distinct values and
        # would otherwise multiply the alert count by that bound. Streaming stays
        # in the grouping because TTFT equals total duration for non-streaming
        # requests, so the two populations are not comparable.
        - alert: EPPHighTTFT
          expr: |
            histogram_quantile(0.99,
              sum by (le, model_name, streaming) (
                rate(llm_d_epp_request_ttft_seconds_bucket[5m])
              )
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "EPP P99 time-to-first-token exceeds 5s"
            description: >-
              The 99th percentile time-to-first-token has exceeded 5 seconds for
              5 minutes on {{ $labels.model_name }} (streaming={{ $labels.streaming }}).
              Model servers may be overloaded or the scheduling policy may be
              suboptimal.

        # Both sides are fully aggregated: request_error_total carries an
        # error_code label that request_total does not, and requests rejected
        # before the body is parsed increment only the error counter. Any
        # grouping finer than sum() drops those series on the vector match.
        - alert: EPPHighRequestErrorRate
          expr: |
            (
              sum(rate(llm_d_epp_request_error_total[5m]))
              /
              sum(rate(llm_d_epp_request_total[5m]))
            ) > 0.05
            and
            sum(rate(llm_d_epp_request_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "EPP request error rate exceeds 5%"
            description: >-
              More than 5% of EPP requests are erroring for 5 minutes.
              Investigate the error_code label breakdown and model-server health.
