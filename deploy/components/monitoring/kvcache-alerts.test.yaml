# promtool unit tests for kvcache-alerts.rules.yml
#
# Run: promtool test rules kvcache-alerts.test.yaml

rule_files:
  - kvcache-alerts.rules.yml

evaluation_interval: 1m

tests:
  # --- KVCacheLowIndexHitRatio ---
  - interval: 1m
    input_series:
      - series: 'llm_d_router_epp_kv_cache_index_lookup_hits_total{}'
        values: '0+1x20'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_requests_total{}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KVCacheLowIndexHitRatio
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "KV-cache index hit ratio below 30%"
              description: >-
                The KV-cache index hit ratio has been below 30% for 10 minutes
                while lookups are still occurring. The index may be cold, mis-sized,
                or experiencing hash collisions.

  # No alert when hit ratio is healthy (50%)
  - interval: 1m
    input_series:
      - series: 'llm_d_router_epp_kv_cache_index_lookup_hits_total{}'
        values: '0+5x20'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_requests_total{}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KVCacheLowIndexHitRatio
        exp_alerts: []

  # --- KVCacheHighLookupLatency ---
  - interval: 1m
    input_series:
      # Simulate all observations landing in the 1s bucket (above 500ms threshold)
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.005"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.01"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.025"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.05"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.1"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.25"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="0.5"}'
        values: '0+0x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="1"}'
        values: '0+10x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="2.5"}'
        values: '0+10x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="5"}'
        values: '0+10x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="10"}'
        values: '0+10x10'
      - series: 'llm_d_router_epp_kv_cache_index_lookup_latency_seconds_bucket{le="+Inf"}'
        values: '0+10x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: KVCacheHighLookupLatency
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "KV-cache index P99 lookup latency exceeds 500ms"
              description: >-
                The 99th percentile KV-cache index lookup latency has exceeded
                500ms for 5 minutes. This adds scheduling overhead and may indicate
                an overloaded or under-provisioned index backend.

  # --- KVCacheSubscriberReconnecting ---
  - interval: 1m
    input_series:
      - series: 'llm_d_router_epp_kv_cache_events_subscriber_reconnections_total{pod_identifier="pod-a"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KVCacheSubscriberReconnecting
        exp_alerts:
          - exp_labels:
              severity: warning
              pod_identifier: pod-a
            exp_annotations:
              summary: "KV-cache event subscriber is reconnecting"
              description: >-
                A ZMQ event subscriber has been reconnecting at a sustained rate
                for 10 minutes. The index may be stale because events are being
                dropped. Check network connectivity to the model-server pod.

  # --- KVCacheEventPoolSaturated ---
  - interval: 1m
    input_series:
      - series: 'llm_d_router_epp_kv_cache_events_pool_queue_depth{}'
        values: '90x10'
      - series: 'llm_d_router_epp_kv_cache_events_pool_capacity{}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: KVCacheEventPoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "KV-cache event pool queue depth exceeds 80% of capacity"
              description: >-
                The event processing pool queue is more than 80% full for
                5 minutes. The EPP may not be keeping up with the KV-cache event
                stream. Consider increasing the worker shard count.

  # --- EPPHighRequestErrorRate ---
  - interval: 1m
    input_series:
      - series: 'llm_d_epp_request_error_total{}'
        values: '0+10x20'
      - series: 'llm_d_epp_request_total{}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: EPPHighRequestErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "EPP request error rate exceeds 5%"
              description: >-
                More than 5% of EPP requests are erroring for 5 minutes.
                Investigate the error_code label breakdown and model-server health.
