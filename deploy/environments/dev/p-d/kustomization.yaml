# ------------------------------------------------------------------------------
# P/D (Prefill/Decode) Development Environment
#
# Deploys the full dev stack with separate prefill and decode deployments.
# ------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../components/vllm-prefill/
- ../../../components/vllm-decode/

patches:
- path: patch-decode.yaml
- target:
    kind: Deployment
    name: vllm-p
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1tensor-parallel-size
      value: "1"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1role-transfer-group
      value: "${ROLE_TRANSFER_GROUP}"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1model-identity
      value: "${MODEL_NAME_SAFE}"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1accelerator-class
      value: "${VLLM_ACCELERATOR_CLASS}"
- target:
    kind: Deployment
    name: vllm-d
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1tensor-parallel-size
      value: "1"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1role-transfer-group
      value: "${ROLE_TRANSFER_GROUP}"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1model-identity
      value: "${MODEL_NAME_SAFE}"
    - op: add
      path: /spec/template/metadata/labels/llm-d.ai~1accelerator-class
      value: "${VLLM_ACCELERATOR_CLASS}"

components:
- ../../../components/overlays/simulator/
