# Sample EPP configuration for running without P/D
#
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: prefix-cache-scorer
- type: decode-filter
- type: max-score-picker
- type: single-profile-handler
# Aggregates GET /v1/models across all pods; a single pod omits adapters loaded elsewhere.
# Auto enable models-data-source and models-data-extractor; declare either will override default.
# requires --allow-experimental-plugins to enable plugin.
- type: models-responder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
