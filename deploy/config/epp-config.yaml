# Sample EPP configuration for running without P/D
#
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: prefix-cache-scorer
- type: decode-filter
- type: max-score-picker
- type: single-profile-handler
# Answers GET /v1/models with the models and LoRA adapters across every pod in the pool.
# Without it the request goes to one pod, whose reply omits adapters loaded elsewhere.
# Listing it also creates models-data-source and models-data-extractor, which collect the
# per-pod model lists it reads. Declare either one explicitly to override its settings.
- type: models-responder
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
