groups:
  - id: registry.llm_d
    type: attribute_group
    brief: Custom llm-d router trace attributes.
    attributes:
      - id: llm_d.coordinator.pipeline.execution_path
        type: string
        brief: "The step combination a request took."
        stability: development
        examples: ["decode-only"]
        annotations:
          go.name: LLMDCoordinatorPipelineExecutionPath
      - id: llm_d.coordinator.pipeline.step_count
        type: int
        brief: "The number of steps configured in the pipeline."
        stability: development
        annotations:
          go.name: LLMDCoordinatorPipelineStepCount
      - id: llm_d.ec_proxy.encode_disaggregation_used
        type: boolean
        brief: "Whether encode disaggregation was used."
        stability: development
        annotations:
          go.name: LLMDECProxyEncodeDisaggregationUsed
      - id: llm_d.ec_proxy.encoder_candidates
        type: int
        brief: "Candidate encoder count in EC proxy."
        stability: development
        annotations:
          go.name: LLMDECProxyEncoderCandidates
      - id: llm_d.ec_proxy.encoder_count
        type: int
        brief: "Allowed encoder count in EC proxy."
        stability: development
        annotations:
          go.name: LLMDECProxyEncoderCount
      - id: llm_d.epp.disagg.reason
        type: string
        brief: "Disaggregation reason."
        stability: development
        examples: ["request_is_nil"]
        annotations:
          go.name: LLMDEPPDisaggReason
      - id: llm_d.epp.encode.disaggregation_used
        type: boolean
        brief: "Whether encode disaggregation was used."
        stability: development
        annotations:
          go.name: LLMDEPPEncodeDisaggregationUsed
      - id: llm_d.epp.encode.endpoints
        type: string
        brief: "Encode endpoints."
        stability: development
        examples: ["10.0.0.1:8000,10.0.0.2:8000"]
        annotations:
          go.name: LLMDEPPEncodeEndpoints
      - id: llm_d.epp.encode.reason
        type: string
        brief: "Encode disaggregation reason."
        stability: development
        examples: ["no_encode_profile_result"]
        annotations:
          go.name: LLMDEPPEncodeReason
      - id: llm_d.epp.fairness.id
        type: string
        brief: "The resolved fairness identity."
        stability: development
        note: "Always paired with llm_d.epp.fairness.source."
        examples: ["tenant-a"]
        annotations:
          go.name: LLMDEPPFairnessID
      - id: llm_d.epp.fairness.source
        type: string
        brief: "How the fairness identity was resolved."
        stability: development
        note: "The value header does not establish that the producer was authenticated."
        examples: ["header"]
        annotations:
          go.name: LLMDEPPFairnessSource
      - id: llm_d.epp.filter.affinity_threshold
        type: double
        brief: "The configured prefix cache affinity threshold."
        stability: development
        annotations:
          go.name: LLMDEPPFilterAffinityThreshold
      - id: llm_d.epp.filter.candidate_endpoints
        type: int
        brief: "The number of endpoints a filter received."
        stability: development
        annotations:
          go.name: LLMDEPPFilterCandidateEndpoints
      - id: llm_d.epp.filter.decision
        type: string
        brief: "The outcome a filter decided on."
        stability: development
        examples: ["sticky"]
        annotations:
          go.name: LLMDEPPFilterDecision
      - id: llm_d.epp.filter.filtered_endpoints
        type: int
        brief: "The number of endpoints a filter returned."
        stability: development
        annotations:
          go.name: LLMDEPPFilterFilteredEndpoints
      - id: llm_d.epp.filter.sticky_endpoints
        type: int
        brief: "The number of endpoints meeting the affinity threshold."
        stability: development
        annotations:
          go.name: LLMDEPPFilterStickyEndpoints
      - id: llm_d.epp.filter.ttft_penalty_ms
        type: double
        brief: "The TTFT penalty the load gate measured, in milliseconds."
        stability: development
        annotations:
          go.name: LLMDEPPFilterTTFTPenaltyMs
      - id: llm_d.epp.pd.disaggregation_used
        type: boolean
        brief: "Whether PD disaggregation was used."
        stability: development
        annotations:
          go.name: LLMDEPPPDDisaggregationUsed
      - id: llm_d.epp.pd.prefill_pod_address
        type: string
        brief: "Selected prefill pod address."
        stability: development
        examples: ["10.0.0.1"]
        annotations:
          go.name: LLMDEPPPDPrefillPodAddress
      - id: llm_d.epp.pd.prefill_pod_port
        type: string
        brief: "Selected prefill pod port."
        stability: development
        examples: ["8000"]
        annotations:
          go.name: LLMDEPPPDPrefillPodPort
      - id: llm_d.epp.pd.reason
        type: string
        brief: "Prefill/decode disaggregation reason."
        stability: development
        examples: ["no_prefill_profile_result"]
        annotations:
          go.name: LLMDEPPPDReason
      - id: llm_d.epp.picker.candidate_endpoints
        type: int
        brief: "Candidate endpoints entering the picker."
        stability: development
        annotations:
          go.name: LLMDEPPPickerCandidateEndpoints
      - id: llm_d.epp.picker.top_endpoints
        type: string[]
        brief: "The top scored endpoint names."
        stability: development
        examples: [["endpoint-a"]]
        annotations:
          go.name: LLMDEPPPickerTopEndpoints
      - id: llm_d.epp.picker.top_scores
        type: double[]
        brief: "The top scored endpoint values."
        stability: development
        examples: [[1.0]]
        annotations:
          go.name: LLMDEPPPickerTopScores
      - id: llm_d.epp.producer.candidate_endpoints
        type: int
        brief: "Producer candidate endpoints count."
        stability: development
        annotations:
          go.name: LLMDEPPProducerCandidateEndpoints
      - id: llm_d.epp.producer.max_match_blocks
        type: int
        brief: "Max matched blocks in producer."
        stability: development
        annotations:
          go.name: LLMDEPPProducerMaxMatchBlocks
      - id: llm_d.epp.producer.result
        type: string
        brief: "Producer result."
        stability: development
        examples: ["skipped_no_tokens"]
        annotations:
          go.name: LLMDEPPProducerResult
      - id: llm_d.epp.producer.total_blocks
        type: int
        brief: "Total blocks in producer."
        stability: development
        annotations:
          go.name: LLMDEPPProducerTotalBlocks
      - id: llm_d.epp.profile_handler.decision
        type: string
        brief: "The profile handler decision."
        stability: development
        examples: ["run_decode"]
        annotations:
          go.name: LLMDEPPProfileHandlerDecision
      - id: llm_d.epp.profile_handler.decode_failed
        type: boolean
        brief: "Whether decode execution failed."
        stability: development
        annotations:
          go.name: LLMDEPPProfileHandlerDecodeFailed
      - id: llm_d.epp.profile_handler.executed_profiles
        type: int
        brief: "Executed profiles count."
        stability: development
        annotations:
          go.name: LLMDEPPProfileHandlerExecutedProfiles
      - id: llm_d.epp.profile_handler.prefill_failed
        type: boolean
        brief: "Whether a required prefill execution failed."
        stability: development
        annotations:
          go.name: LLMDEPPProfileHandlerPrefillFailed
      - id: llm_d.epp.profile_handler.selected_profile
        type: string
        brief: "The selected profile name."
        stability: development
        examples: ["decode"]
        annotations:
          go.name: LLMDEPPProfileHandlerSelectedProfile
      - id: llm_d.epp.profile_handler.total_profiles
        type: int
        brief: "Total profiles evaluated."
        stability: development
        annotations:
          go.name: LLMDEPPProfileHandlerTotalProfiles
      - id: llm_d.epp.scheduling.profile.name
        type: string
        brief: "The scheduled profile name."
        stability: development
        examples: ["decode"]
        annotations:
          go.name: LLMDEPPProfileName
      - id: llm_d.epp.scorer.candidate_endpoints
        type: int
        brief: "The number of candidate endpoints for a scorer."
        stability: development
        annotations:
          go.name: LLMDEPPScorerCandidateEndpoints
      - id: llm_d.epp.scorer.count
        type: int
        brief: "The number of scorers configured in a profile."
        stability: development
        annotations:
          go.name: LLMDEPPScorerCount
      - id: llm_d.epp.scorer.endpoints_scored
        type: int
        brief: "The number of endpoints scored."
        stability: development
        annotations:
          go.name: LLMDEPPScorerEndpointsScored
      - id: llm_d.epp.scorer.name
