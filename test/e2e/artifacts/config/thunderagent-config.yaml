apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig

# ThunderAgent scheduling for agentic workloads: per-pod admission control
# with strict session-to-pod affinity (a minimal implementation of
# arXiv 2602.13692). Clients carry a session identifier in the x-session-id
# header.
#
# One thunder-agent instance serves three roles:
#   - scorer in the synthesized default scheduling profile (pins a session to
#     the pod that holds its KV),
#   - flow-control saturation detector (feeds the plugin its per-cycle view
#     of the endpoint pool; it never gates and always reports unsaturated),
#   - fairness policy (the admission gate: turns of admitted sessions always
#     dispatch; paused and new sessions are admitted only when they fit a
#     pod, paused ones first, smallest first; idle sessions past
#     idleGracePeriod are paused on demand to make room).
#
# Held requests can wait up to forceAdmitTimeout. defaultRequestTTL is 0s
# (no queue eviction), so the gateway route timeout must be raised
# accordingly, or clients disconnect before admission.

featureGates:
- flowControl

plugins:
- type: agent-identity
  parameters:
    additionalSessionHeaders:
    - x-session-id
- type: thunder-agent
  parameters:
    forceAdmitTimeout: "30m"

flowControl:
  # No queue eviction: a held request is force-admitted after forceAdmitTimeout
  # instead of being rejected with 429.
  defaultRequestTTL: "0s"
  saturationDetector:
    pluginRef: thunder-agent
  defaultPriorityBand:
    fairnessPolicyRef: thunder-agent
