# Sample EPP configuration for running without P/D
# with small hash block size for simulation purposes.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: token-producer
  parameters:
    modelName: ${MODEL_NAME}
    vllm:
      url: ${VLLM_RENDER_URL}  # substituted by kind-dev-env.sh envsubst (render Service)
- type: endpoint-notification-source
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSizeTokens: 16
    kvEventsConfig:
      podDiscoveryConfig:
        socketPort: 5557 # each simulator pod binds it (--zmq-endpoint=tcp://*:5557)
    indexerConfig:
      kvBlockIndexConfig:
        enableMetrics: false                # enable kv-block index metrics (prometheus)
        metricsLoggingInterval: 60000000000 # log kv-block metrics as well (1m in nanoseconds)
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: decode-filter
- type: max-score-picker
- type: single-profile-handler
dataLayer:
  sources:
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer # subscribes to each endpoint's KV events
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 10
