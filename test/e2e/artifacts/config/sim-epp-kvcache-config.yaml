# Sample EPP configuration for running without P/D
# with small hash block size for simulation purposes.
# e2e only: the simulator pods publish KV events to a socket the EPP binds
# (kvEventsConfig.zmqEndpoint with allowUntrustedPublishers). Deployments omit
# zmqEndpoint; each engine binds its own PUB socket and the producer subscribes
# to every discovered endpoint by default.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: token-producer
  parameters:
    modelName: ${MODEL_NAME}
    vllm:
      url: ${VLLM_RENDER_URL}  # substituted by kind-dev-env.sh envsubst (render Service)
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSizeTokens: 16
    kvEventsConfig:
      zmqEndpoint: tcp://0.0.0.0:5557
      allowUntrustedPublishers: true  # simulator pods publish to the EPP's bound socket
    indexerConfig:
      kvBlockIndexConfig:
        enableMetrics: false                # enable kv-block index metrics (prometheus)
        metricsLoggingInterval: 60000000000 # log kv-block metrics as well (1m in nanoseconds)
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: decode-filter
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 10
