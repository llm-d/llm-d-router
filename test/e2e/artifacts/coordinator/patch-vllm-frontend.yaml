apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
      volumes:
      - name: frontend-sockets
        emptyDir: {}
      containers:
      - name: coordinator
        volumeMounts:
        - name: frontend-sockets
          mountPath: /run/llm-d
      initContainers:
      - name: vllm-frontend
        restartPolicy: Always
        image: quay.io/sageac/vllm-rust-frontend@sha256:c51de836dd5a3fd77dae68d4d0f916cae267ecf0f6846e50073615272e4202a4
        args:
        - --forward-request-header=x-request-id
        - --forward-request-header=x-llm-d-inference-fairness-id
        - --generation-url=unix:///run/llm-d/generation.sock
        - --model=Qwen/Qwen3-0.6B
        - --revision=c1899de289a04d12100db370d81485cdf75e47ca
        - --max-model-len=512
        volumeMounts:
        - name: frontend-sockets
          mountPath: /run/llm-d
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - --silent
            - --unix-socket
            - /run/llm-d/frontend-http.sock
            - http://localhost/health
