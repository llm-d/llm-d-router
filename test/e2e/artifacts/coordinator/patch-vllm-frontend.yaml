apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      initContainers:
      - name: vllm-frontend
        restartPolicy: Always
        image: quay.io/sageac/vllm-rust-frontend@sha256:5732c51ad79829b4670d84de7dcfdbd35c056847d74c56e77f351bde4c74b524
        args:
        - --grpc-port=50051
        - --generation-url=http://127.0.0.1:8081
        - --model=Qwen/Qwen3-0.6B
        - --revision=c1899de289a04d12100db370d81485cdf75e47ca
        - --max-model-len=512
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - |
              exec 3<>/dev/tcp/127.0.0.1/8000
              printf 'GET /health HTTP/1.0\r\n\r\n' >&3
              read -r status <&3
              [[ "$status" == HTTP/*" 200 "* ]]
