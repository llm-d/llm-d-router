apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
      volumes:
      - name: frontend-sockets
        emptyDir: {}
      containers:
      - name: coordinator
        volumeMounts:
        - name: frontend-sockets
          mountPath: /run/llm-d
      initContainers:
      - name: vllm-frontend
        restartPolicy: Always
        image: quay.io/sageac/vllm-rust-frontend@sha256:fca8b6292a884153f9b42bbd3c06e875b9d383012da3f6cfbb057e4d606c2919
        args:
        - --generation-url=unix:///run/llm-d/generation.sock
        - --model=Qwen/Qwen3-0.6B
        - --revision=c1899de289a04d12100db370d81485cdf75e47ca
        - --max-model-len=512
        volumeMounts:
        - name: frontend-sockets
          mountPath: /run/llm-d
        readinessProbe:
          exec:
            command:
            - curl
            - --fail
            - --silent
            - --unix-socket
            - /run/llm-d/frontend-http.sock
            - http://localhost/health
