apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-coordinator
  labels:
    app: llm-d-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-coordinator
  template:
    metadata:
      labels:
        app: llm-d-coordinator
    spec:
      serviceAccountName: llm-d-coordinator
      terminationGracePeriodSeconds: 30
      containers:
      - name: coordinator
        image: ${COORDINATOR_IMAGE}
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/coordinator/coordinator.yaml
        ports:
        - name: https
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        # Startup gets its own budget: generating the self-signed certificate
        # on a slow node can outlast the liveness failure threshold.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTPS
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTPS
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTPS
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/coordinator
      volumes:
      - name: config
        configMap:
          name: llm-d-coordinator-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-coordinator
  labels:
    app: llm-d-coordinator
spec:
  selector:
    app: llm-d-coordinator
  type: ClusterIP
  ports:
  - name: https
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
