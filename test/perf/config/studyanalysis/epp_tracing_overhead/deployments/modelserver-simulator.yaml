apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-tracing-modelserver
spec:
  replicas: 8
  selector:
    matchLabels:
      app: epp-tracing-modelserver
  template:
    metadata:
      labels:
        app: epp-tracing-modelserver
        llm-d.ai/guide: optimized-baseline
        llm-d.ai/model: qwen-qwen3-06b
        llm-d.ai/role: decode
        study.llm-d.ai/name: epp-tracing-overhead
    spec:
      containers:
        - name: modelserver
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --served-model-name
            - Qwen/Qwen3-0.6B
            - --port
            - "8000"
            - --mode=random
            - --latency-calculator=constant
            - --time-to-first-token=20ms
            - --inter-token-latency=1ms
            - --max-num-seqs=256
            - --seed=1
            - --max-model-len=16384
          ports:
            - name: modelserver
              containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: modelserver
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: modelserver
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
