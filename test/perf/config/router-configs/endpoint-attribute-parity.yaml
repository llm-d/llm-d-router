# Endpoint-attribute variant of optimized-baseline, for the #2059 item-1
# benchmark. Differs from optimized-baseline.yaml in exactly one respect:
# queue-scorer and kv-cache-utilization-scorer are replaced by two
# endpoint-attribute-scorer instances configured to reproduce them, reading
# WaitingQueueSize and KVCacheUsagePercent directly from the attributes
# published by the default core-metrics-extractor. Every other plugin, weight
# and setting is identical, so a difference in the benchmark is attributable
# to the scorer swap and nothing else.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      v: 4
      enable-pprof: "true"
      tracing: "false"
    pluginsConfigFile: "ea-parity-plugins.yaml"
    pluginsCustomConfig:
      ea-parity-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: endpoint-attribute-scorer
          name: ea-queue-scorer
          parameters:
            attributeKey: WaitingQueueSize
            algorithm:
              type: linear_lower_is_better
              normalization:
                adaptiveRange: {}
        - type: endpoint-attribute-scorer
          name: ea-kv-cache-scorer
          parameters:
            attributeKey: KVCacheUsagePercent
            algorithm:
              type: linear_lower_is_better
              normalization:
                fixedRange:
                  min: 0.0
                  max: 1.0
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 100000
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: ea-queue-scorer
            weight: 2
          - pluginRef: ea-kv-cache-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
