# Endpoint-attribute variant of optimized-baseline, for the #2059 parity
# benchmark. It differs from optimized-baseline.yaml in two places:
# queue-scorer and kv-cache-utilization-scorer are replaced by two
# endpoint-attribute-scorer instances configured to reproduce them, reading
# WaitingQueueSize and KVCacheUsagePercent from the attributes published by
# the default core-metrics-extractor, and allow-experimental-plugins is set
# because endpoint-attribute-scorer is an Alpha plugin. All other plugins,
# weights and settings match optimized-baseline.yaml.

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      v: 4
      enable-pprof: "true"
      tracing: "false"
      allow-experimental-plugins: "true"
    pluginsConfigFile: "ea-parity-plugins.yaml"
    pluginsCustomConfig:
      ea-parity-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: endpoint-attribute-scorer
          name: ea-queue-scorer
          parameters:
            attributeKey: WaitingQueueSize
            algorithm:
              type: linear_lower_is_better
              normalization:
                adaptiveRange: {}
        - type: endpoint-attribute-scorer
          name: ea-kv-cache-scorer
          parameters:
            attributeKey: KVCacheUsagePercent
            algorithm:
              type: linear_lower_is_better
              normalization:
                fixedRange:
                  min: 0.0
                  max: 1.0
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 100000
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: ea-queue-scorer
            weight: 2
          - pluginRef: ea-kv-cache-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http

  proxy:
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "32"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"
