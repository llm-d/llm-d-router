# Router configuration for Prefill/Decode (P/D) disaggregation with session affinity using llm-d-sim.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      v: 4
      enable-pprof: "true"
      tracing: "false"
      ha-enable-leader-election: "false"
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: passthrough-parser
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: session-affinity-filter
          name: session-affinity-decode
          parameters:
            headerName: x-session-token
        - type: session-affinity-filter
          name: session-affinity-prefill
          parameters:
            headerName: x-session-token-prefill
            profileName: prefill
        - type: random-picker
        requestHandler:
          parsers:
          - pluginRef: passthrough-parser
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: session-affinity-prefill
          - pluginRef: random-picker
        - name: decode
          plugins:
          - pluginRef: session-affinity-decode
          - pluginRef: random-picker

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http

  proxy:
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "32"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"
