# Router configuration that combines load-aware-scorer with session-affinity-filter and passthrough-parser,
# with standalone service-mode proxy (`router.proxy.mode: service`) Horizontal Pod Autoscaling (HPA v2) enabled.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      v: 4
      enable-pprof: "true"
      tracing: "false"
      health-checking: true
      allow-experimental-plugins: "true"
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: passthrough-parser
        - type: session-affinity-filter
        - type: load-aware-scorer
          parameters:
            threshold: 128
        - type: weighted-random-picker
        requestHandler:
          parsers:
          - pluginRef: passthrough-parser
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: session-affinity-filter
          - pluginRef: load-aware-scorer
            weight: 5
          - pluginRef: weighted-random-picker

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http

  proxy:
    mode: service
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
    args:
      - "--service-node"
      - "envoy-proxy"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "32"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "2"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "250m"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"
