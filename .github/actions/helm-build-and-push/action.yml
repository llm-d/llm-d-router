name: 'Helm Build and Push'
description: 'Builds, packages, and pushes a specific EPP Helm chart using Makefile rules'
inputs:
  chart_name:
    description: 'Name of the chart to build and push (llm-d-router-standalone or llm-d-router-gateway)'
    required: true
  extra_tag:
    description: 'Tag for the EPP image and chart version (e.g., v0.1.0 or branch name)'
    required: true
  chart_suffix:
    description: 'Optional suffix to append to the chart name (e.g. -dev)'
    required: false
    default: ''
  epp_image_repository:
    description: 'EPP image repository name (e.g. llm-d-router-endpoint-picker)'
    required: false
    default: 'llm-d-router-endpoint-picker'
  pr_number:
    description: 'Pull request number. When set, the chart is versioned as <chart_version_base>-pr.<n> (plus an immutable +sha.<pr_sha> snapshot).'
    required: false
    default: ''
  pr_sha:
    description: 'Short SHA of the pull request head, used for the immutable chart version snapshot.'
    required: false
    default: ''
  chart_version_base:
    description: 'Latest release tag used as the version base for pull request charts.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Package and Push Chart
      shell: bash
      env:
        EXTRA_TAG: "${{ inputs.extra_tag }}"
        CHART_SUFFIX: "${{ inputs.chart_suffix }}"
        EPP_RELEASE_IMAGE_REPOSITORY: "${{ inputs.epp_image_repository }}"
        PR_NUMBER: "${{ inputs.pr_number }}"
        PR_SHA: "${{ inputs.pr_sha }}"
        CHART_VERSION_BASE: "${{ inputs.chart_version_base }}"
      run: |
        make helm-push CHART="${{ inputs.chart_name }}"
