name: E2E runner setup
description: Frees disk space when low and restores Go module/build caches for an e2e runner.
inputs:
  cache-job:
    description: Job identifier used to isolate the Go build cache namespace
    required: false
    default: e2e
outputs:
  go-mod-cache:
    description: Absolute path to the Go module cache directory
    value: ${{ steps.go-cache.outputs.mod }}
  go-build-cache:
    description: Absolute path to the Go build cache directory
    value: ${{ steps.go-cache.outputs.build }}
  go-version:
    description: Go version parsed from Dockerfile.builder for keying build caches
    value: ${{ steps.go-cache.outputs.goversion }}
  go-build-cache-hit:
    description: Whether the Go build cache key matched exactly on restore
    value: ${{ steps.go-build-cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - name: Check available disk space
      id: disk
      shell: bash
      run: |
        avail_gb=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
        echo "Available disk space on /: ${avail_gb}G"
        if [[ "${avail_gb:-0}" -lt 40 ]]; then
          echo "needs_cleanup=true" >> "$GITHUB_OUTPUT"
        else
          echo "needs_cleanup=false" >> "$GITHUB_OUTPUT"
        fi

    # Custom profile with directory-only removals.
    # cleanup-profile: max frees more space but takes longer.
    # Only run when free space is below 40 GB (ubuntu-latest starts with ~88 GB free).
    - name: Free disk space
      if: steps.disk.outputs.needs_cleanup == 'true'
      # justinthelaw/maximize-github-runner-space@v0.9.0
      uses: justinthelaw/maximize-github-runner-space@ed391644e646cac4b88480d2f9b12d135f1ccf77
      with:
        cleanup-profile: custom
        remove-android: 'true'
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'false'
        remove-swift: 'true'
        remove-julia: 'true'
        remove-rust: 'true'
        remove-miniconda: 'true'
        swapfile-size: 0

    - name: Create Go cache dirs
      id: go-cache
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/llm-d-gomodcache" "$HOME/.cache/llm-d-gobuildcache"
        echo "mod=$HOME/.cache/llm-d-gomodcache" >> "$GITHUB_OUTPUT"
        echo "build=$HOME/.cache/llm-d-gobuildcache" >> "$GITHUB_OUTPUT"
        echo "goversion=$(sed -n 's/^FROM golang:\([^ ]*\).*/\1/p' Dockerfile.builder)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache.outputs.mod }}
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Restore Go build cache
      id: go-build-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache.outputs.build }}
        key: gobuild-${{ inputs.cache-job }}-${{ runner.os }}-go${{ steps.go-cache.outputs.goversion }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ inputs.cache-job }}-${{ runner.os }}-go${{ steps.go-cache.outputs.goversion }}-
