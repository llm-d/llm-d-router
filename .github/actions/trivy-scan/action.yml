name: Trivy Scan
description: Scan container image with official Aqua Security Trivy action
inputs:
  image:
    required: false
    default: ''
    description: "Image reference to scan (e.g., 'my-repo/my-image:latest'). Mutually exclusive with 'tarball'."
  tarball:
    required: false
    default: ''
    description: "Path to a local image tarball to scan (e.g. /tmp/image.tar from buildx type=docker,dest=...). Mutually exclusive with 'image'."
  severity:
    required: false
    default: 'HIGH,CRITICAL'
    description: "Comma-separated severities that fail the scan (e.g. 'CRITICAL' or 'MEDIUM,HIGH,CRITICAL')."
  exit-code:
    required: false
    default: '1'
    description: "Exit code on a severity match: '1' fails the build, '0' reports only. SARIF uploads either way."
  ignore-unfixed:
    required: false
    default: 'false'
    description: "'true' leaves out findings that have no fixed version."
  skip-dirs:
    required: false
    default: ''
    description: "Comma-separated directories in the image to leave out of the scan."

runs:
  using: "composite"
  steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0 ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ inputs.image }}
        input: ${{ inputs.tarball }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: ${{ inputs.severity }}
        exit-code: ${{ inputs.exit-code }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        skip-dirs: ${{ inputs.skip-dirs }}
        # trivy-action drops the severity filter for SARIF output unless told
        # otherwise, which fails the scan on findings outside `severity` (e.g.
        # UNKNOWN-severity Go vulndb notes).
        limit-severities-for-sarif: 'true'
        version: 'v0.74.0'

    - name: Upload Trivy SARIF to Security tab
      uses: github/codeql-action/upload-sarif@v4.35.4 # v4.35.4 68bde559dea0fdcac2102bfdf6230c5f70eb485e
      if: always()
      with:
        sarif_file: trivy-results.sarif
