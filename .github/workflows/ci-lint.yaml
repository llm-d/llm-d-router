name: CI - Lint

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    # pull_request_target fires even when GITHUB_TOKEN creates the PR (e.g. the
    # release-notes bot). pull_request does not. We register pull_request_target
    # so bot-created PRs get a "skipped" conclusion that satisfies branch
    # protection, but we skip all real work: pull_request already covers human
    # PRs, and running twice would cause the concurrency group to cancel one run.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - '**/*.go'
              - Dockerfile.*
              - Makefile*
              - go.mod
              - go.sum
              - .golangci.yml
              - .golangci-security.yml
              - .typos.toml
              - scripts/**
              - hack/**
              - test/**
              - .github/workflows/ci-lint.yaml

  lint:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Create Go cache dirs
        id: go-cache
        run: |
          mkdir -p "$HOME/.cache/llm-d-gomodcache" "$HOME/.cache/llm-d-gobuildcache"
          echo "mod=$HOME/.cache/llm-d-gomodcache" >> "$GITHUB_OUTPUT"
          echo "build=$HOME/.cache/llm-d-gobuildcache" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-cache-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-${{ runner.os }}-

      - name: Run make build
        env:
          GO_MOD_CACHE_VOL: ${{ steps.go-cache.outputs.mod }}
          GO_BUILD_CACHE_VOL: ${{ steps.go-cache.outputs.build }}
        run: make build

      - name: Run make lint
        env:
          GO_MOD_CACHE_VOL: ${{ steps.go-cache.outputs.mod }}
          GO_BUILD_CACHE_VOL: ${{ steps.go-cache.outputs.build }}
        run: make lint

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Run make lint-security
        env:
          GO_MOD_CACHE_VOL: ${{ steps.go-cache.outputs.mod }}
          GO_BUILD_CACHE_VOL: ${{ steps.go-cache.outputs.build }}
        run: make lint-security

      # Fork PRs run with a read only GITHUB_TOKEN that cannot upload SARIF.
      # Pinned to a commit SHA rather than a tag, unlike other actions in this
      # workflow, per GitHub's guidance for actions that write security data.
      - name: Upload gosec SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: gosec.sarif
          category: gosec

      # On runs that skip the upload above the artifact is the only way to
      # reach the findings.
      - name: Upload gosec SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gosec-sarif
          path: gosec.sarif
          retention-days: 7
          if-no-files-found: warn

  # The configs under test/testdata/plugins/stable/ are the written-down form of the
  # backwards-compatibility promise made when a plugin is promoted to Stable. Editing
  # one to make TestStablePluginConfigs pass would silently retract that promise, so
  # within a major version they may only be added to, never changed or removed.
  frozen-stable-configs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # The diff below needs the merge base with the target branch.
          fetch-depth: 0

      - name: Fail on modified or deleted frozen plugin configs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Added files (status A) are how a newly promoted plugin lands here, so
          # only modifications, deletions and renames are rejected.
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA...HEAD" \
            -- 'test/testdata/plugins/stable/v*' || true)

          if [ -n "$changed" ]; then
            echo "::error::This PR changes frozen stable plugin configs:"
            echo "$changed"
            echo
            echo "Files under test/testdata/plugins/stable/v*/ record the config surface a"
            echo "Stable plugin promised to keep working for the whole major version, so they"
            echo "may only be added to. If TestStablePluginConfigs is failing, the plugin"
            echo "changed incompatibly: fix the plugin or drop it back to Beta. A change that"
            echo "cannot be made compatibly belongs in the next major version's directory."
            exit 1
          fi

          echo "No frozen stable plugin configs were changed."
