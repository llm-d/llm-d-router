name: CI - Main - Docker Container Image

on:
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  set-params:
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    outputs:
      epp_name: ${{ steps.version.outputs.epp_name }}
      sidecar_name: ${{ steps.version.outputs.sidecar_name }}
      coordinator_name: ${{ steps.version.outputs.coordinator_name }}
      tag: ${{ steps.tag.outputs.tag }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Set image names
        id: version
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "epp_name=${repo}-endpoint-picker" >> "$GITHUB_OUTPUT"
          echo "sidecar_name=${repo}-disagg-sidecar" >> "$GITHUB_OUTPUT"
          echo "coordinator_name=${repo}-coordinator" >> "$GITHUB_OUTPUT"

      - name: Set branch name as tag
        id: tag
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set short commit SHA
        id: sha
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    if: github.event.repository.fork != true
    needs: set-params
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci-build-images.yaml
    with:
      epp-image-name: ${{ needs.set-params.outputs.epp_name }}
      sidecar-image-name: ${{ needs.set-params.outputs.sidecar_name }}
      coordinator-image-name: ${{ needs.set-params.outputs.coordinator_name }}
      tag: ${{ needs.set-params.outputs.tag }}
      prerelease: true
      chart-suffix: ""
      epp-additional-tags: ghcr.io/llm-d/${{ needs.set-params.outputs.epp_name }}:sha-${{ needs.set-params.outputs.short_sha }}
      sidecar-additional-tags: ghcr.io/llm-d/${{ needs.set-params.outputs.sidecar_name }}:sha-${{ needs.set-params.outputs.short_sha }}
      coordinator-additional-tags: ghcr.io/llm-d/${{ needs.set-params.outputs.coordinator_name }}:sha-${{ needs.set-params.outputs.short_sha }}
