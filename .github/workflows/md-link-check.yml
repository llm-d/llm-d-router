name: Markdown Link Checker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  
  check-for-markdown-files:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Resolve base commit
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote origin "refs/heads/${BASE_REF}" | awk -v ref="refs/heads/${BASE_REF}" '$2 == ref {print $1; exit}')
          test -n "$sha"
          echo "sha=${RUN_ATTEMPT}:${sha}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - '**/*.md'
              - '.github/actions/merge-pr-onto-base/action.yml'

  lychee:
    name: Check Markdown Links
    needs: check-for-markdown-files
    # pull_request_target fires even when GITHUB_TOKEN creates the PR (e.g. the
    # release-notes bot). pull_request does not. We register pull_request_target
    # so bot-created PRs get a "skipped" conclusion that satisfies branch
    # protection, but we skip all real work: pull_request already covers human
    # PRs, and running twice would cause the concurrency group to cancel one run.
    if: github.event_name != 'pull_request_target' && needs.check-for-markdown-files.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Merge PR onto live base branch
        uses: ./.github/actions/merge-pr-onto-base
        with:
          base-sha: ${{ needs.check-for-markdown-files.outputs.base_sha }}

      # A missing cache is fine. Lychee then checks every link.
      - id: cache-key
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore lychee cache
        id: lychee-cache
        uses: actions/cache/restore@v6
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('.lychee.toml') }}-${{ steps.cache-key.outputs.date }}
          restore-keys: |
            lychee-${{ hashFiles('.lychee.toml') }}-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: '--config .lychee.toml --cache --max-cache-age 1d --verbose --no-progress "**/*.md"'
          fail: true

      # Save the cache so later runs send fewer requests and finish faster.
      # This also runs when the check fails, so links that passed are still saved.
      - name: Save lychee cache
        if: ${{ !cancelled() && steps.lychee-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('.lychee.toml') }}-${{ steps.cache-key.outputs.date }}
