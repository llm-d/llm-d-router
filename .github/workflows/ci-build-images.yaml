name: Build and Push Container Images

on:
  workflow_call:
    inputs:
      epp-image-name:
        required: true
        type: string
      sidecar-image-name:
        required: true
        type: string
      coordinator-image-name:
        required: true
        type: string
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      chart-suffix:
        required: false
        type: string
        default: ''
      registry:
        required: false
        type: string
        description: Registry namespace to push to (ghcr.io/llm-d for production, quay.io/llm-d for PR staging).
        default: 'ghcr.io/llm-d'
      pr-number:
        required: false
        type: string
        description: Pull request number. Set only for PR staging builds, which version charts as <base>-pr.<n>.
        default: ''
      pr-sha:
        required: false
        type: string
        description: Short SHA of the pull request head. Set only for PR staging builds.
        default: ''
      commit-sha:
        required: false
        type: string
        description: Commit SHA embedded in the images and used for the per-commit tag. Defaults to the workflow's SHA; PR builds pass the pull request head SHA.
        default: ''
      chart-version-base:
        required: false
        type: string
        description: Latest release tag, used as the version base for PR staging charts.
        default: ''
      epp-additional-tags:
        required: false
        type: string
        default: ''
      sidecar-additional-tags:
        required: false
        type: string
        default: ''
      coordinator-additional-tags:
        required: false
        type: string
        default: ''

  secrets:
    QUAY_USER:
      required: false
      description: Quay robot account user, used when registry is quay.io/llm-d.
    QUAY_TOKEN:
      required: false
      description: Quay robot account token, used when registry is quay.io/llm-d.

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-epp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build AMD64 EPP image (no push)
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.epp
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.epp-image-name }}
          registry: ${{ inputs.registry }}
          push: 'false'
          buildx-outputs: type=docker,dest=/tmp/epp-image.tar

      # Gate the push on the scan: a HIGH/CRITICAL by default when not set but configurable
      - name: Run Trivy scan for EPP on AMD64
        uses: ./.github/actions/trivy-scan
        with:
          tarball: /tmp/epp-image.tar

      # Re-run the build with push enabled with: cache-to/cache-from type=gha
      - name: Push EPP image for both AMD64 and ARM64
        id: push-epp
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.epp
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.epp-image-name }}
          registry: ${{ inputs.registry }}
          registry-username: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_USER || github.actor }}
          registry-password: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_TOKEN || github.token }}
          prerelease: ${{ inputs.prerelease }}
          commit-sha: ${{ inputs.commit-sha || github.sha }}
          push: 'true'
          additional-tags: ${{ inputs.epp-additional-tags }}

      - name: Attest EPP image provenance
        if: inputs.registry == 'ghcr.io/llm-d'
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.epp-image-name }}
          subject-digest: ${{ steps.push-epp.outputs.digest }}
          push-to-registry: true

  build-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build sidecar AMD64 image (no push)
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.sidecar
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.sidecar-image-name }}
          registry: ${{ inputs.registry }}
          push: 'false'
          buildx-outputs: type=docker,dest=/tmp/sidecar-image.tar

      - name: Run Trivy scan on sidecar image on AMD64
        uses: ./.github/actions/trivy-scan
        with:
          tarball: /tmp/sidecar-image.tar

      - name: Push sidecar image for both AMD64 and ARM64
        id: push-sidecar
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.sidecar
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.sidecar-image-name }}
          registry: ${{ inputs.registry }}
          registry-username: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_USER || github.actor }}
          registry-password: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_TOKEN || github.token }}
          prerelease: ${{ inputs.prerelease }}
          commit-sha: ${{ inputs.commit-sha || github.sha }}
          push: 'true'
          additional-tags: ${{ inputs.sidecar-additional-tags }}

      - name: Attest sidecar image provenance
        if: inputs.registry == 'ghcr.io/llm-d'
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.sidecar-image-name }}
          subject-digest: ${{ steps.push-sidecar.outputs.digest }}
          push-to-registry: true

  build-coordinator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build coordinator AMD64 image (no push)
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.coordinator
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.coordinator-image-name }}
          registry: ${{ inputs.registry }}
          push: 'false'
          buildx-outputs: type=docker,dest=/tmp/coordinator-image.tar

      - name: Run Trivy scan on coordinator image on AMD64
        uses: ./.github/actions/trivy-scan
        with:
          tarball: /tmp/coordinator-image.tar

      - name: Push coordinator image for both AMD64 and ARM64
        id: push-coordinator
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.coordinator
          tag: ${{ inputs.tag }}
          image-name: ${{ inputs.coordinator-image-name }}
          registry: ${{ inputs.registry }}
          registry-username: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_USER || github.actor }}
          registry-password: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_TOKEN || github.token }}
          prerelease: ${{ inputs.prerelease }}
          commit-sha: ${{ inputs.commit-sha || github.sha }}
          push: 'true'
          additional-tags: ${{ inputs.coordinator-additional-tags }}

      - name: Attest coordinator image provenance
        if: inputs.registry == 'ghcr.io/llm-d'
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.coordinator-image-name }}
          subject-digest: ${{ steps.push-coordinator.outputs.digest }}
          push-to-registry: true

  # Gated on a published and attested image rather than a path filter, so a push
  # or attestation that fails or is skipped is retried on the next call instead
  # of never firing again.
  # Not needed for push-helm-charts because the builder is unrelated to chart publishing.
  build-builder:
    if: inputs.registry == 'ghcr.io/llm-d'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Compute builder tag
        id: builder-tag
        run: echo "tag=$(make print-builder-tag)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # gh exits 1 for a missing tag, a missing attestation and an API error alike,
      # so any failure rebuilds. The output stays in the log to show which one it was.
      - name: Check whether the builder image is already published and attested
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh attestation verify oci://ghcr.io/llm-d/llm-d-builder:${{ steps.builder-tag.outputs.tag }} \
              --repo "$GITHUB_REPOSITORY"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No verified attestation for the builder tag, rebuilding"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Dockerfile.builder executes RUN steps on the target platform, so the
      # arm64 leg needs emulation. The service Dockerfiles cross-compile instead.
      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build builder AMD64 image (no push)
        if: steps.check.outputs.exists == 'false'
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.builder
          tag: ${{ steps.builder-tag.outputs.tag }}
          image-name: llm-d-builder
          registry: ghcr.io/llm-d
          push: 'false'
          buildx-outputs: type=docker,dest=/tmp/builder-image.tar

      # Findings in the Go toolchain, podman and the docker CLI never block this
      # build. SARIF still uploads to the Security tab.
      - name: Run Trivy scan for builder on AMD64
        if: steps.check.outputs.exists == 'false'
        uses: ./.github/actions/trivy-scan
        with:
          tarball: /tmp/builder-image.tar
          exit-code: '0'

      # prerelease: 'true' suppresses the composite action's floating :latest
      # tag and commit-sha is omitted to skip the per-commit tag. The builder is
      # addressed only by its content hash tag.
      - name: Push builder image for both AMD64 and ARM64
        if: steps.check.outputs.exists == 'false'
        id: push-builder
        uses: ./.github/actions/docker-build-and-push
        with:
          docker-file: Dockerfile.builder
          tag: ${{ steps.builder-tag.outputs.tag }}
          image-name: llm-d-builder
          registry: ghcr.io/llm-d
          github-token: ${{ github.token }}
          prerelease: 'true'
          push: 'true'

      - name: Attest builder image provenance
        if: steps.check.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/llm-d/llm-d-builder
          subject-digest: ${{ steps.push-builder.outputs.digest }}
          push-to-registry: true

  push-helm-charts:
    needs: [build-epp, build-sidecar, build-coordinator]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry == 'quay.io/llm-d' && 'quay.io' || 'ghcr.io' }}
          username: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_USER || github.actor }}
          password: ${{ inputs.registry == 'quay.io/llm-d' && secrets.QUAY_TOKEN || github.token }}

      - name: Build and Push Standalone Chart
        uses: ./.github/actions/helm-build-and-push
        env:
          IMAGE_REGISTRY: ${{ inputs.registry }}
        with:
          chart_name: llm-d-router-standalone
          extra_tag: ${{ inputs.tag }}
          chart_suffix: ${{ inputs.chart-suffix }}
          epp_image_repository: ${{ inputs.epp-image-name }}
          pr_number: ${{ inputs.pr-number }}
          pr_sha: ${{ inputs.pr-sha }}
          chart_version_base: ${{ inputs.chart-version-base }}

      - name: Build and Push Gateway Chart
        uses: ./.github/actions/helm-build-and-push
        env:
          IMAGE_REGISTRY: ${{ inputs.registry }}
        with:
          chart_name: llm-d-router-gateway
          extra_tag: ${{ inputs.tag }}
          chart_suffix: ${{ inputs.chart-suffix }}
          epp_image_repository: ${{ inputs.epp-image-name }}
          pr_number: ${{ inputs.pr-number }}
          pr_sha: ${{ inputs.pr-sha }}
          chart_version_base: ${{ inputs.chart-version-base }}


