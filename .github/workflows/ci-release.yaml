name: CI - Release - Docker Container Image

on:
  push:
    tags:
      - 'v*'  # Runs when a tag like v0.1.0 is pushed
  release:
    types: [published]  # Also runs when a GitHub release is published

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  set-params:
    runs-on: ubuntu-latest
    outputs:
      epp_name: ${{ steps.version.outputs.epp_name }}
      sidecar_name: ${{ steps.version.outputs.sidecar_name }}
      coordinator_name: ${{ steps.version.outputs.coordinator_name }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Set image names
        id: version
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "epp_name=${repo}-endpoint-picker" >> "$GITHUB_OUTPUT"
          echo "sidecar_name=${repo}-disagg-sidecar" >> "$GITHUB_OUTPUT"
          echo "coordinator_name=${repo}-coordinator" >> "$GITHUB_OUTPUT"

      - name: Determine tag name
        id: tag
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "tag=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          PRE_RELEASE=${{ github.event_name != 'release' || github.event.release.prerelease }}
          echo "prerelease=${PRE_RELEASE}" >> "$GITHUB_OUTPUT"
        shell: bash

  build-and-push:
    needs: set-params
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci-build-images.yaml
    with:
      epp-image-name: ${{ needs.set-params.outputs.epp_name }}
      sidecar-image-name: ${{ needs.set-params.outputs.sidecar_name }}
      coordinator-image-name: ${{ needs.set-params.outputs.coordinator_name }}
      tag: ${{ needs.set-params.outputs.tag }}
      prerelease: ${{ fromJSON(needs.set-params.outputs.prerelease) }}
      chart-suffix: ""

  upload-artifacts:
    needs: set-params
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.set-params.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Build Artifacts
        run: |
          make artifacts BUNDLE_VERSION="$RELEASE_TAG"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # upload-sbom uploads to this release, so it has to exist even when
          # there is nothing to attach here.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist. Creating a draft release..."
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi
          files=$(find artifacts -type f -size +0c | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No artifacts to upload."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" $files --clobber

  upload-sbom:
    needs: [set-params, build-and-push, upload-artifacts]
    runs-on: ubuntu-latest
    # A tag push and the release publish it triggers can both run this
    # workflow for the same tag. Queue duplicate runs of this job instead of
    # letting their --clobber uploads interleave.
    concurrency:
      group: upload-sbom-${{ needs.set-params.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_TAG: ${{ needs.set-params.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Collect SBOMs
        run: |
          scripts/collect-sboms.sh "$RELEASE_TAG" \
            "${{ needs.set-params.outputs.epp_name }}" \
            "${{ needs.set-params.outputs.sidecar_name }}" \
            "${{ needs.set-params.outputs.coordinator_name }}"

      - name: Upload SBOMs to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" sbom/* --clobber
