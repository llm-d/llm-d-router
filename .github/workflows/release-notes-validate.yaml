name: Validate Release Note

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    # pull_request_target fires even when GITHUB_TOKEN creates the PR (e.g. the
    # release-notes assembly bot). pull_request does not. We register
    # pull_request_target so bot-created PRs get a "skipped" conclusion that
    # satisfies branch protection, but we skip all real work: pull_request
    # already covers human PRs, and running both would double-report.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release-note block
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Avoid `xargs` here: with no command it runs `echo` which interprets
          # quotes, so notes containing apostrophes (e.g. "Don't ...") would
          # error and the note would be silently dropped.
          NOTE=$(printf '%s' "$PR_BODY" | tr -d '\r' | \
            sed -n '/^```release-note/,/^```/p' | sed '1d;$d' | \
            tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')

          if [[ -z "$NOTE" ]]; then
            echo "::error::No release-note block found in the PR body. Add a \`\`\`release-note\`\`\` block (write NONE if there is no user-facing change)."
            exit 1
          fi

          if [[ "${NOTE,,}" == "none" ]]; then
            echo "No user-facing change declared."
            exit 0
          fi

          echo "Release note: ${NOTE}"
