name: Check Typos

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # github.event.pull_request.number is null outside pull_request, so the group
  # falls back to github.ref. Creating a gh-readonly-queue branch raises both a
  # push and a merge_group event on that same ref, so github.event_name keeps
  # the two runs in separate groups instead of cancelling each other and
  # reporting a cancelled "typos" required check to the merge queue.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check typos
        uses: crate-ci/typos@v1.50.3

