# Keeps the generated SGLang Go bindings under pkg/common/grpc/sglang/gen in
# sync with sgl-project/sglang. When upstream changes its schemas, opens a pull
# request (or updates the open one) that moves SGLANG_REF and regenerates the
# bindings. The sync logic lives in hack/sync-sglang-proto.sh.
name: Sync SGLang protos

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'sgl-project/sglang ref to sync to (default: newest main commit that changed the SGLang proto schemas)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'llm-d/llm-d-router'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/sync-sglang-proto
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger CI, so the
      # branch is pushed and the PR opened with a GitHub App token.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROTO_SYNC_APP_ID || secrets.RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.PROTO_SYNC_APP_PRIVATE_KEY || secrets.RELEASE_NOTES_APP_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Sync to the newest upstream schemas
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.ref }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: hack/sync-sglang-proto.sh

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SHORT_REF: ${{ steps.sync.outputs.short_ref }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add Makefile.gen.mk pkg/common/grpc/sglang
          title="Sync SGLang protos to sgl-project/sglang@${SHORT_REF}"
          git commit -s -m "${title}"
          # One standing branch: each run replaces the previous proposal.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&state=open" --jq '.[0].number // empty')
          if [[ -n "${pr}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f title="${title}" -F "body=@${PR_BODY_FILE}" --silent
            echo "Updated #${pr}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body-file "${PR_BODY_FILE}"
          fi
