name: Check Signed Commits in PR

on:
  pull_request_target:
  merge_group:
    types: [checks_requested]

jobs:
  dco-check:
    name: dco-check
    # Skip the bot-authored release-notes assembly branch: assembly is a
    # deterministic transform reviewed by a maintainer before merge. Pin to the
    # specific prefix so an unrelated bot pushing to release-notes/<other>
    # doesn't bypass. merge_group entries never originate from those bot
    # branches directly, so the skip only needs to guard the PR side.
    if: |
      github.event_name == 'merge_group' ||
      (
        github.event_name == 'pull_request_target' &&
        !(
          contains(fromJSON('["dependabot[bot]"]'), github.event.pull_request.user.login) ||
          (
            startsWith(github.head_ref, 'release-notes/assemble-') &&
            endsWith(github.event.pull_request.user.login, '[bot]')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by trailer matches commit author email (DCO)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_merge_group=0
          pr_author_login=""
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
            is_merge_group=1
            # The queue's branch ref is gh-readonly-queue/<base>/pr-<number>-<sha>;
            # pull the PR number out of it to look up its real author login.
            pr_number=$(echo "${{ github.event.merge_group.head_ref }}" | sed -E 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#')
            pr_author_login=$(gh api "repos/${{ github.repository }}/pulls/$pr_number" --jq '.user.login')
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          fi
          # GitHub Apps we allow to satisfy DCO by name instead of email:
          # dependabot commits its own Signed-off-by trailer, but under the
          # noreply author address rather than the support@github.com address
          # in the trailer, so the exact-email match never succeeds.
          bot_allowlist="dependabot[bot]"

          fail=0
          for c in $(git rev-list "$base..$head"); do
            author_name=$(git show -s --format='%an' "$c")
            author_email=$(git show -s --format='%ae' "$c")
            trailers=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c")
            if [ -z "$trailers" ]; then
              echo "::error::commit $c is missing a Signed-off-by trailer (author email: $author_email)"
              fail=1
              continue
            fi
            match=0
            author_email_lc="${author_email,,}"
            pr_author_login_lc="${pr_author_login,,}"
            # The merge queue squashes a PR into one commit; either the commit
            # author or a Signed-off-by trailer can carry the real email while
            # the other carries the noreply form an account with "keep my
            # email private" set uses, so both sides are checked against the
            # noreply pattern. The real email is not lost in that case: the
            # per-commit checks under pull_request_target already verified it
            # on every commit of the PR. A noreply address is trusted only
            # when the login embedded in it matches the PR's actual author, so
            # a forged noreply-shaped address for someone else's account fails.
            #
            # A trailer satisfies the exact-email match when it carries an
            # address equal to the author email, compared without regard to
            # case because mail providers treat the local part that way. A
            # value written by hand is accepted on the same terms as one
            # produced by git commit -s; use git to write it.
            author_noreply_login=""
            if [[ "$author_email" =~ ^[0-9]+\+(.+)@users\.noreply\.github\.com$ ]]; then
              author_noreply_login="${BASH_REMATCH[1],,}"
            fi
            if [ "$is_merge_group" -eq 1 ] && [ -n "$author_noreply_login" ] && [ "$author_noreply_login" = "$pr_author_login_lc" ]; then
              match=1
            fi
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              trailer_email=""
              if [[ "$line" =~ ([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+) ]]; then
                trailer_email="${BASH_REMATCH[1]}"
              fi
              trailer_email_lc="${trailer_email,,}"
              if [ "$trailer_email_lc" = "$author_email_lc" ]; then
                match=1
              fi
              if [ "$is_merge_group" -eq 1 ] && [[ "$trailer_email" =~ ^[0-9]+\+(.+)@users\.noreply\.github\.com$ ]]; then
                trailer_noreply_login="${BASH_REMATCH[1],,}"
                if [ "$trailer_noreply_login" = "$pr_author_login_lc" ]; then
                  match=1
                fi
              fi
              case " $bot_allowlist " in
                *" $author_name "*)
                  case "$line" in
                    "$author_name "*) match=1 ;;
                  esac
                  ;;
              esac
            done <<<"$trailers"
            if [ "$match" -ne 1 ]; then
              echo "::error::commit $c Signed-off-by email does not match commit author email. expected: $author_email, found: $trailers"
              fail=1
            fi
          done
          exit $fail
