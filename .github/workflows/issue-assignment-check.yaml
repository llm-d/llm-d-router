# Releases assigned issues that show no progress. An assigned issue with no
# open pull request and no comment from an assignee gets one reminder comment.
# Without a reply from an assignee it is unassigned and labeled help wanted.
# docs/issue_triage.md describes the policy.

name: Issue assignment check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log the actions without changing any issue'
        type: boolean
        default: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry-run || 'false' }}
      DAYS_BEFORE_REMINDER: 30
      DAYS_BEFORE_UNASSIGN: 14
      # Marks the reminder comment so a later run can recognize it.
      MARKER: '<!-- assignment-reminder -->'
      # Open assigned issues with their linked pull requests, the pull
      # requests that mention them, their comments and the latest assignment.
      QUERY: |
        query($q: String!, $endCursor: String) {
          search(query: $q, type: ISSUE, first: 25, after: $endCursor) {
            pageInfo { hasNextPage endCursor }
            nodes {
              ... on Issue {
                number
                createdAt
                assignees(first: 10) { nodes { login } }
                comments(last: 100) { nodes { author { login } body createdAt } }
                closedByPullRequestsReferences(first: 20) { nodes { state } }
                mentions: timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], last: 100) {
                  nodes {
                    ... on CrossReferencedEvent {
                      source { ... on PullRequest { state author { login } } }
                    }
                  }
                }
                assigned: timelineItems(itemTypes: [ASSIGNED_EVENT], last: 1) {
                  nodes { ... on AssignedEvent { createdAt } }
                }
              }
            }
          }
        }
    steps:
      - name: Remind or unassign
        run: |
          remind_before=$(date -u -d "$DAYS_BEFORE_REMINDER days ago" +%Y-%m-%dT%H:%M:%SZ)
          unassign_before=$(date -u -d "$DAYS_BEFORE_UNASSIGN days ago" +%Y-%m-%dT%H:%M:%SZ)

          # One line per issue that needs an action: <action> <number> <assignees>.
          # $active is the latest comment by an assignee. An assignee who has not
          # commented is counted from the assignment, so a new assignee gets the full period.
          gh api graphql --paginate -f query="$QUERY" \
            -f q="repo:$REPO is:issue is:open assignee:*" \
            --jq '.data.search.nodes[]' |
            jq -r --arg marker "$MARKER" --arg remind "$remind_before" --arg unassign "$unassign_before" '
              (.assignees.nodes | map(.login)) as $users
              | .createdAt as $created
              | select([.closedByPullRequestsReferences.nodes[] | select(.state == "OPEN")] | length == 0)
              | select([.mentions.nodes[].source
                        | select(.state == "OPEN" and (.author.login as $author | $users | index($author)))]
                       | length == 0)
              | ([.comments.nodes[]
                  | select(.author.login == "github-actions" and (.body | contains($marker)))
                  | .createdAt] | max) as $reminder
              | ([.assigned.nodes[].createdAt,
                  (.comments.nodes[] | select(.author.login as $author | $users | index($author)) | .createdAt)]
                 | max // $created) as $active
              | (if $reminder != null and $reminder > $active
                 then (if $reminder < $unassign then "unassign" else empty end)
                 elif $active < $remind then "remind"
                 else empty
                 end) as $action
              | "\($action) \(.number) \($users | join(","))"' |
            while read -r action number users; do
              echo "$action #$number ($users)"
              [ "$DRY_RUN" = true ] && continue
              if [ "$action" = remind ]; then
                gh issue comment "$number" --repo "$REPO" --body "$MARKER
          @${users//,/ @} this issue is assigned to you and has no open pull request. No assignee has commented on it for $DAYS_BEFORE_REMINDER days. Please comment with a status update. If no assignee comments within $DAYS_BEFORE_UNASSIGN days, the issue will be unassigned so that someone else can pick it up." < /dev/null
              else
                gh issue edit "$number" --repo "$REPO" --remove-assignee "$users" --add-label 'help wanted' < /dev/null
                gh issue comment "$number" --repo "$REPO" --body "This issue was unassigned because it has no open pull request and no assignee replied to the status reminder within $DAYS_BEFORE_UNASSIGN days. It is labeled \`help wanted\`. Comment \`/assign\` to take it." < /dev/null
              fi
            done
