name: Assemble Release Notes on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  assemble:
    # RC tags are pre-release; only assemble notes for final releases.
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.RELEASE_NOTES_APP_PRIVATE_KEY }}

      - name: Get App user id
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Assemble release notes from PR bodies and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # ── Phase 1: recover the PR list from the tag-to-tag commit range ──
          # Version-order adjacency, not ancestry: each release-X.Y branch forks
          # from main and is never merged back, so a prior GA tag is typically
          # not a git ancestor of a later one even though its content is. The
          # tag immediately preceding TAG by semver is always the right
          # boundary; git's two-dot range below resolves it via merge-base
          # regardless of literal ancestry.
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-rc' | \
            awk -v t="$TAG" '$0==t{found=1; next} found{print; exit}')
          range="${prev_tag:+${prev_tag}..}${TAG}"

          # Most merges to this repo are squash merges, so each PR lands as one
          # commit whose subject ends in "(#N)"; a backport merged onto a
          # release branch with a real merge commit still carries the
          # original squashed commits with their "(#N)" subjects, so scanning
          # every commit's subject (not just non-merge ones) still finds them.
          mapfile -t prs < <(git log --format=%s "$range" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+')

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No PRs found in range ${range} for ${TAG}; exiting."
            exit 0
          fi

          # ── Phase 2: read each PR's release-note block live from its body ──
          tmp=$(mktemp)
          warnings=()
          for pr in "${prs[@]}"; do
            json=$(gh pr view "$pr" --json body,mergedAt,url)
            body=$(printf '%s' "$json" | jq -r '.body')
            merged_at=$(printf '%s' "$json" | jq -r '.mergedAt')
            url=$(printf '%s' "$json" | jq -r '.url')

            note=$(printf '%s' "$body" | tr -d '\r' | \
              sed -n '/^```release-note/,/^```/p' | sed '1d;$d' | \
              tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')

            if [[ -z "$note" ]]; then
              warnings+=("$pr")
              continue
            fi
            if [[ "${note,,}" == "none" ]]; then
              continue
            fi

            printf '%s\t%s\t%s\t%s\n' "$merged_at" "$pr" "$url" "$note" >> "$tmp"
          done

          sort -k1,1 "$tmp" -o "$tmp"

          today=$(date -u +%Y-%m-%d)
          new_section=$(mktemp)
          printf 'RELEASE %s %s\n' "$TAG" "$today" > "$new_section"
          while IFS=$'\t' read -r merged_at pr url note; do
            printf '%s %s %s\n' "${merged_at:0:10}" "$url" "$note" >> "$new_section"
          done < "$tmp"
          printf '\n' >> "$new_section"

          # ── Phase 3: branch from main so the PR contains only
          #    RELEASE-NOTES.md changes ─────────────────────────────────────
          git fetch origin main
          BRANCH="release-notes/assemble-${TAG}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" origin/main

          touch RELEASE-NOTES.md
          cat "$new_section" RELEASE-NOTES.md > RELEASE-NOTES.md.new
          mv RELEASE-NOTES.md.new RELEASE-NOTES.md
          git add RELEASE-NOTES.md
          git commit -s -m "docs: assemble release notes for ${TAG}"
          # Force-push so a re-run (re-tag, manual workflow re-run) overwrites
          # the prior branch rather than failing non-fast-forward.
          git push -f origin "$BRANCH"

          pr_body="Assembles release notes for ${TAG} from merged PR bodies in range ${range}."
          if [[ ${#warnings[@]} -gt 0 ]]; then
            pr_body+=$'\n\nPRs with a missing or malformed release-note block, skipped: '
            pr_body+=$(printf '#%s, ' "${warnings[@]}")
            pr_body="${pr_body%, }"
          fi

          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Assembly PR already open for $BRANCH; pushed update."
          else
            gh pr create \
              --title "docs: assemble release notes for ${TAG}" \
              --body "$pr_body" \
              --base main \
              --head "$BRANCH"
          fi
