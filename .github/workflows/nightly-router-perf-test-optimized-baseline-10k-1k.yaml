name: Nightly - Router Perf Test (Optimized Baseline 10k-1k)

on:
  schedule:
    - cron: '0 9 * * *'  # Run daily at 09:00 UTC
  workflow_dispatch:      # Enable manual triggering from UI
    inputs:
      gcp_project_id:
        description: 'GCP Project ID'
        default: 'llm-d-scale'
        required: true
        type: string
      gke_cluster_name:
        description: 'GKE Cluster Name'
        default: 'llm-d-ap-usc1-router-perf'
        required: true
        type: string
      gke_cluster_zone:
        description: 'GKE Cluster Zone/Region'
        default: 'us-central1'
        required: true
        type: string
      target:
        description: 'Benchmark target manifest'
        default: 'test/perf/config/targets/optimized-baseline-job1.yaml'
        required: true
        type: string
      gcs_bucket:
        description: 'GCS bucket name for storing performance test results'
        default: 'llm-d-router-perf-results'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-perf-benchmark:
    runs-on: ubuntu-latest
    env:
      # This cluster must have the Gateway API Inference Extension CRDs
      # already installed in it.
      GCP_PROJECT_ID: ${{ inputs.gcp_project_id || 'llm-d-scale' }}
      GKE_CLUSTER_NAME: ${{ inputs.gke_cluster_name || 'llm-d-ap-usc1-router-perf' }}
      GKE_CLUSTER_ZONE: ${{ inputs.gke_cluster_zone || 'us-central1' }}
      TARGET: ${{ inputs.target || 'test/perf/config/targets/optimized-baseline-job1.yaml' }}
      GCS_BUCKET: ${{ inputs.gcs_bucket || 'llm-d-router-perf-results' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout llm-d/llm-d-router
        uses: actions/checkout@v7

      - name: Checkout kubernetes-sigs/inference-perf
        uses: actions/checkout@v7
        with:
          repository: kubernetes-sigs/inference-perf
          # Pinned so the load generator's chart changes only with a reviewed bump.
          ref: 29ec1d4f7cf3f8e640081091f819418eb195d135
          path: inference-perf

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up gcloud CLI and kubectl
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: 'kubectl,gke-gcloud-auth-plugin'

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER_NAME }}" \
            --zone "${{ env.GKE_CLUSTER_ZONE }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Install helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Graphviz
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Run Performance Test Script
        run: |
          python3 test/perf/run_nightly_perf.py \
            --target ${{ env.TARGET }} \
            --perf-chart ${{ github.workspace }}/inference-perf/deploy/inference-perf \
            --results-dir test/perf/results/optimized-baseline \
            --gcp-project ${{ env.GCP_PROJECT_ID }} \
            --collect-pprof-profiles \
            --gcs-bucket ${{ env.GCS_BUCKET }}

      - name: Compare with the trailing 7-day median
        run: |
          python3 test/perf/trend.py \
            --results-dir test/perf/results/optimized-baseline \
            --target ${{ env.TARGET }} \
            --output-dir trend-output \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload trend verdict
        uses: actions/upload-artifact@v7
        with:
          name: perf-trend
          path: trend-output/

      - name: Upload Performance Results Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: epp-perf-results
          path: test/perf/results/optimized-baseline/

  # Kept apart from the benchmark job so the token that can write issues never
  # shares a job with the cloud and Hugging Face secrets.
  report-perf-trend:
    needs: run-perf-benchmark
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download trend verdict
        uses: actions/download-artifact@v8
        with:
          name: perf-trend
          path: trend-output

      - name: Open or update the trend issue
        if: hashFiles('trend-output/trend-issue.md') != ''
        run: |
          # trend.py writes the issue marker as the first line of the body.
          marker=$(head -n 1 trend-output/trend-issue.md)
          number=$(gh issue list --repo "$REPO" --state open --label kind/performance --limit 200 --json number,body |
            jq -r --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file trend-output/trend-issue.md
          else
            target_id=$(jq -r .test_name trend-output/trend-verdict.json)
            gh issue create --repo "$REPO" --title "Nightly perf trend: ${target_id} regressed" \
              --label kind/performance --body-file trend-output/trend-issue.md
          fi
