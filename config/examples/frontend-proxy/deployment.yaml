apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      initContainers:
      - name: vllm-frontend
        restartPolicy: Always
        image: grpc-generation-frontend:local
        args:
        - --grpc-port=50051
        - --generation-url=http://127.0.0.1:8081
        - --model=Qwen/Qwen3-0.6B
        - --revision=c1899de289a04d12100db370d81485cdf75e47ca
        - --max-model-len=512
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - |
              exec 3<>/dev/tcp/127.0.0.1/8000
              printf 'GET /health HTTP/1.0\r\n\r\n' >&3
              read -r status <&3
              [[ "$status" == HTTP/*" 200 "* ]]
      containers:
      - name: coordinator
        image: coordinator-frontend:local
        ports:
        - name: public
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: public
        readinessProbe:
          httpGet:
            path: /readyz
            port: public
        volumeMounts:
        - name: config
          mountPath: /config/coordinator
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: coordinator-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
spec:
  selector:
    app: frontend-proxy
  ports:
  - name: public
    port: 8080
    targetPort: public
    appProtocol: kubernetes.io/h2c
