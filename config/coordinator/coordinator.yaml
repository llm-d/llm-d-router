# Coordinator configuration.
#
# Every parameter that the coordinator and its pipeline steps recognise is
# listed below. Required values are uncommented; optional values are shown
# commented with their defaults so an operator can copy-and-edit instead of
# reading source. Lines tagged "env: ..." can also be set via environment
# variable; the env var overrides the YAML value.

# log_level controls global log verbosity. Higher = more output.
#   1 = warning, 2 = info, 3 = verbose, 4 = debug, 5 = trace.
# The CLI flag -v overrides this when set.
#
# Do not enable level 5 (trace) in production. Trace logs request and response
# bodies (with redaction) through the gateway client (encode and prefill steps),
# including kv_transfer_params and ec_transfer_params coordination fields such as
# bootstrap_host, bootstrap_room, and remote_host.
# A compromised log store would expose them.
log_level: 2

# tracing exports the coordinator's own OpenTelemetry spans: one per request,
# one for the pipeline, one per step, and one per outbound gateway call.
# Health and readiness probes are never traced. Default false.
# Trace context is extracted from incoming requests and injected into gateway
# calls either way, so leaving this off keeps client and EPP spans in one trace
# and only omits the coordinator's spans from it.
# The exporter, sampler, and collector endpoint come from the standard OTEL_*
# environment variables. Set OTEL_EXPORTER_OTLP_ENDPOINT to the collector; the
# default is localhost:4317. Without OTEL_TRACES_SAMPLER, 10% of root traces
# are sampled (parentbased_traceidratio, 0.1).
# The --tracing CLI flag overrides this field.
# env: COORDINATOR_TRACING
# tracing: false

# -------------------------------------------------------------------------------
# server: listener for incoming OpenAI-compatible requests. Serves TLS unless
# secure_serving is false.
# -------------------------------------------------------------------------------
server:
  # listen_addr is the address:port the coordinator binds to.
  listen_addr: ":8080"

  # metrics_port is the port for the Prometheus /metrics endpoint. Default 9090.
  # Non-positive disables the endpoint entirely. The --metrics-port CLI flag
  # overrides this.
  # env: COORDINATOR_SERVER_METRICS_PORT
  # metrics_port: 9090

  # metrics_cert_dir is the directory containing tls.crt and tls.key for the
  # metrics endpoint. Empty serves metrics over HTTP. If set, missing or invalid
  # files stop the coordinator. The metrics listener does not fall back to HTTP.
  # The --metrics-cert-dir CLI flag overrides this field.
  # env: COORDINATOR_SERVER_METRICS_CERT_DIR
  # metrics_cert_dir: ""

  # secure_serving serves the inference listener over TLS. Default true.
  # The --secure-serving CLI flag overrides this field.
  # env: COORDINATOR_SERVER_SECURE_SERVING
  # secure_serving: true

  # cert_path is the directory containing tls.crt and tls.key for the inference
  # listener. Empty generates a self-signed certificate, which is only suitable
  # for testing. Certificate changes are picked up without a restart.
  # The --cert-path CLI flag overrides this field.
  # env: COORDINATOR_SERVER_CERT_PATH
  # cert_path: ""

  # tls_min_version is the minimum TLS version the inference listener accepts,
  # for example VersionTLS12 or VersionTLS13. Empty uses VersionTLS12.
  # The --tls-min-version CLI flag overrides this field.
  # env: COORDINATOR_SERVER_TLS_MIN_VERSION
  # tls_min_version: ""

  # tls_cipher_suites are the cipher suites the inference listener accepts, by
  # Go crypto/tls name. Empty uses the crypto/tls default. Only effective for
  # TLS 1.2 and below; TLS 1.3 cipher suites are not configurable.
  # The --tls-cipher-suites CLI flag overrides this field.
  # env: COORDINATOR_SERVER_TLS_CIPHER_SUITES
  # tls_cipher_suites: []

  # read_timeout caps how long the server waits for the full request body.
  # Long enough for HD images inlined as data URLs (~hundreds of KB).
  read_timeout: 30s

  # write_timeout caps the entire response. For streaming completions this
  # bounds the total in-flight time of a single chat — set generously.
  write_timeout: 120s
  
  # Kubernetes terminationGracePeriodSeconds must exceed shutdown_timeout; SSE
  # streams held open for up to write_timeout are force-closed once the grace period expires.
  shutdown_timeout: 25s

  # max_request_body_size caps the request body in megabytes. The default is
  # sized for multimodal requests that inline images as data: URIs, which land
  # in the body verbatim and are not subject to replace-media-urls.max_download_size.
  # Deployments that also accept inline audio or video (input_audio parts, or
  # data:audio/data:video URIs in audio_url/video_url slots) may need much more:
  # base64 inflates by 4/3, so a 100 MB video inlines as ~133 MB in the body.
  # A text-only deployment can set a much smaller value. Megabytes; default 64.
  # env: COORDINATOR_SERVER_MAX_REQUEST_BODY_SIZE
  # max_request_body_size: 64

# ---------------------------------------------------------------------------
# gateway: outbound HTTP client used by encode/prefill/decode to reach the
# Inference Gateway.
# ---------------------------------------------------------------------------
gateway:
  # address is the base URL of the Inference Gateway (no trailing slash).
  # Every path-bearing call (e.g. /v1/chat/completions) is appended to this.
  address: "http://inference-gateway:80"

  # max_idle_conns_per_host caps the size of the keep-alive pool. Encode
  # fan-out can open many concurrent connections; raise if you see
  # connection churn under multi-image load.
  max_idle_conns_per_host: 200

  # idle_conn_timeout is how long an idle keep-alive connection survives
  # before the transport closes it.
  idle_conn_timeout: 90s

  # timeout is the response-header timeout per outbound request. Body
  # streaming is not bounded by this.
  timeout: 60s

# ---------------------------------------------------------------------------
# pipeline: ordered list of steps that process every request.
# ---------------------------------------------------------------------------
pipeline:
  # kv_connector picks the protocol used to coordinate KV-cache transfer
  # between prefill and decode pods.
  #   kv-nixl           - NIXL P2P RDMA
  #   kv-shared-storage - shared filesystem / object store (default)
  #   kv-sglang         - SGLang-style KV bootstrap
  kv_connector: kv-shared-storage

  # ec_connector picks the protocol used to ship encoded multimodal embedding
  # tensors from encoder pods to prefill pods.
  #   ec-nixl           - NIXL P2P RDMA
  #   ec-shared-storage - shared filesystem (default for non-RDMA clusters)
  ec_connector: ec-shared-storage

  # use_openai_format selects the wire format for the encode and prefill steps.
  #   true (default) - forward on the client's original OpenAI path
  #                    (/v1/chat/completions, /v1/completions, /v1/responses).
  #   false          - rewrite to the internal /inference/v1/generate
  #                    token-array (tokens-in) format.
  # false requires a render step in the pipeline (render produces the token
  # IDs the tokens-in format sends); the coordinator fails to start otherwise.
  # A step may override this in its own params.
  # env: COORDINATOR_PIPELINE_USE_OPENAI_FORMAT
  use_openai_format: true

  # Carries selected response headers from each upstream phase into every
  # later phase. Only listed headers are forwarded. This allows EPP-stamped
  # scheduling metadata to constrain later roles in a disaggregated pipeline.
  # Client-supplied values for listed headers are discarded until an upstream
  # phase returns a replacement value. When this setting is omitted, it
  # defaults to x-llm-d-disagg-revision. Declaring the setting replaces that
  # default; use an empty list to disable response-header forwarding.
  # forward_response_headers:
  #   - x-llm-d-disagg-revision
  #   - x-disagg-slice

  steps:
    # -------------------------------------------------------------------
    # async-broker: optional, and when enabled it must run first. Bridges
    # the coordinator to the llm-d-async broker. A request that carries the
    # mode header (default x-llm-d-async-mode: passthrough | enqueue | wait) opts
    # into async serving: passthrough labels it (quota classification,
    # objective and fairness headers) and lets the pipeline continue;
    # enqueue answers 202 with the request id; wait holds the connection
    # until the result lands or the wait cap expires. Without the mode
    # header the step is a no-op. It also serves GET/DELETE
    # /v1/requests/{id}.
    # All params and their defaults are documented in
    # pkg/coordinator/steps/asyncbroker/config.go.
    # -------------------------------------------------------------------
    # - type: async-broker
    #   params:
    #     # The Redis holding the async processor's queues. Required.
    #     redis_url: "redis://redis:6379"
    #     # Routes select the broker queue and tier per (model, tenant);
    #     # first match wins, empty fields match anything.
    #     routes:
    #       - model: "my-model"
    #         queue: "team-a-queue"
    #         tier: "interactive"
    #     # Objectives stamped on passthrough requests by tier, selected
    #     # by quota classification (reserved vs overflow).
    #     objectives:
    #       interactive:
    #         reserved: "interactive-reserved"
    #         overflow: "interactive-overflow"
    #     # Reserved concurrency per tenant; tenants without an entry are
    #     # always classified reserved. Counters are shared with the AP's
    #     # redis-quota gate.
    #     quota:
    #       limits:
    #         team-a: 8
    #     # wait_cap_seconds bounds held wait connections, ending the hold
    #     # with the 202 response. Holds otherwise run to the request
    #     # deadline.
    #     # wait_cap_seconds: 55
    #     # fetch_grace_seconds is the mailbox TTL applied after a delivered
    #     # fetch. Zero deletes the result on delivery.
    #     # fetch_grace_seconds: 60

    # -------------------------------------------------------------------
    # replace-media-urls: an optional step executed prior to request
    # content processing. Downloads http(s) URLs from image_url, audio_url, and
    # video_url content parts (base64-inlining them as data: URIs), validates
    # input_audio inline items, and seeds MultimodalEntries for every recognized
    # media part. All modalities feed the encode step's fanout, so the encoder
    # pod must accept audio/video content-part types.
    # -------------------------------------------------------------------
    - type: replace-media-urls
      params:
        # download_timeout caps each individual media download.
        download_timeout: 10s

        # max_concurrent_downloads bounds the errgroup that fans out
        # downloads. Useful when a single request references many media items.
        max_concurrent_downloads: 10

        # max_multimodal_entries rejects requests with more than N media parts
        # (image_url + audio_url + video_url + input_audio combined) BEFORE any
        # download happens. Cheapest admission gate, and the only thing bounding
        # how many bytes one request can pull into memory; see max_download_size
        # for why raising a per-modality cap means raising this one too.
        #
        # 0 (or omitted) = unlimited, which lets a request body of a few KB name
        # hundreds of URLs and turn each one into a download.
        # max_multimodal_entries: 8

        # max_download_size caps the megabytes read per media download. A response
        # whose Content-Length or body exceeds the cap is rejected as a client
        # error (4xx). This is the global default; each modality below may
        # override it. Default 10 MB.
        #
        # Peak memory is per REQUEST, not per concurrent download: every payload
        # is retained until the step returns. Base64 inflates by 4/3, so this
        # step alone holds
        #
        #   (media parts in the request) x (that modality's cap) x 4/3
        #
        # for the base64 form the payload is inlined as, plus up to
        # max_concurrent_downloads x cap x 7/3 for downloads still in flight,
        # which hold the raw bytes and their encoded copy at the same time.
        # max_concurrent_downloads throttles how fast bytes arrive, not how many
        # are held at once.
        #
        # That figure is only a floor for the pod. The payloads stay on the
        # request body and each later step that sends the body serializes them
        # again into its own buffer: render, prefill, and decode each hold a full
        # copy while their upstream call is in flight, and the encode fanout
        # holds one media part per concurrent sub-request (up to its
        # max_parallel). Size the memory limit for several times that figure.
        #
        # So max_multimodal_entries is the limit that actually bounds this:
        # 8 parts x 10 MB is ~107 MB in this step, while 8 parts at
        # max_video_download_size: 200 is ~2.1 GB here and multiples of that
        # across the pipeline. Raise a per-modality cap below only together with
        # max_multimodal_entries.
        #
        # What each cap covers differs by modality:
        #
        #   image  http(s) downloads only, when the cap comes from this global
        #          value; an image data: URI is then bounded by
        #          server.max_request_body_size instead. Setting
        #          max_image_download_size covers data: URIs as well.
        #   audio  http(s) downloads, audio_url data: URIs, and input_audio
        #          inline payloads.
        #   video  http(s) downloads and video_url data: URIs.
        #
        # Inline payloads are bounded on base64 length, before any decode, so an
        # oversized item is rejected without being allocated.
        #
        # For an inline payload, server.max_request_body_size binds first and
        # usually binds lower: the payload arrives base64-encoded in the body,
        # so its 64 MB default stops a raw payload at 64 x 3/4 = 48 MB whatever
        # these caps say. A cap above that is reachable on http(s) downloads,
        # where the client sends only a URL, but not on input_audio or a data:
        # URI. Raising one of these caps for inline media means raising
        # max_request_body_size to the encoded size too: 60 MB of audio needs
        # 80 MB of body, and 200 MB of video needs 267 MB.
        # max_download_size: 10

        # max_image_download_size overrides max_download_size for image_url
        # items. Same units (MB), same overflow validation. Setting it also
        # widens what the image cap covers: it bounds image data: URIs, which
        # the global max_download_size never does, so leaving it unset is what
        # keeps a config that has always set only max_download_size accepting
        # the bodies it accepts today. Set it to bound inline image memory.
        # max_image_download_size: 10

        # max_audio_download_size overrides max_download_size for audio_url
        # items. Audio codec decoders historically carry more CVEs than image
        # decoders, so keep this tight until the audio decode path has had a
        # security review end-to-end. This value is reachable on downloads;
        # inline audio also needs server.max_request_body_size raised, as the
        # note on max_download_size explains.
        # max_audio_download_size: 60

        # max_video_download_size overrides max_download_size for video_url
        # items. Videos routinely need 100+ MB per clip, so leave it commented
        # out only if the deployment does not accept video. The codec-CVE caveat
        # on max_audio_download_size applies here too, as does the body-size
        # one: a video this size is a download, since no default body cap comes
        # close to holding it inline.
        # max_video_download_size: 200

        # allowed_{image,audio,video}_content_types below each REPLACE the
        # built-in allowlist for that modality when set to a non-empty list; an
        # empty list accepts any content type for that modality, matching
        # allowed_domains's "empty means unrestricted" convention.
        #
        # Write the key with a value or leave it out entirely: a key with
        # nothing after it is a null value, not an empty list, and the
        # coordinator refuses to start rather than guess which was meant. That
        # is the shape a template renders from an unset variable.
        #
        # A list ENTRY that names no type -- empty, whitespace, or only MIME
        # parameters such as "; charset=utf-8" -- is refused the same way, and
        # for the same reason: the list would be non-empty, so it would accept
        # only that entry, which no content type can match, and the modality
        # would reject every request. That is the opposite of the empty list
        # above, so it is not a usable way to spell "allow anything".

        # allowed_image_content_types overrides the built-in image MIME
        # allowlist. A non-empty list accepts ONLY these types, for image_url
        # data URIs AND for the Content-Type an http(s) image_url origin
        # returns; an empty list accepts any type.
        #
        # Leaving it unset differs from listing the defaults: the built-in
        # default is enforced on data URIs only, because plenty of origins serve
        # a valid image as application/octet-stream or with no Content-Type at
        # all, while setting the param reads as a deliberate lockdown and covers
        # both paths. Audio and video downloads are always checked, and they
        # tolerate an unlabeled origin for this same reason; what they refuse is
        # a type that is positively wrong. See allowed_audio_content_types for
        # why they are checked at all.
        # Default: image/jpeg, image/png, image/gif, image/webp.
        # allowed_image_content_types:
        #   - image/jpeg
        #   - image/png

        # allowed_audio_content_types overrides the built-in audio MIME
        # allowlist. Applies to audio_url data URIs, to the Content-Type an
        # http(s) audio_url origin returns, and to input_audio parts. Unlike
        # image, the download path is checked whether or not this param is set.
        #
        # While this param is unset, a download that arrives unlabeled is
        # accepted: S3, GCS and presigned URLs serve every object as
        # application/octet-stream unless its type was set at upload, and an
        # absent header reads the same. Refusing those would buy nothing, since
        # an origin that is actively lying can send audio/wav just as easily;
        # what the check still refuses is an origin that honestly returns
        # something else, such as an HTML error page or a login redirect.
        #
        # Setting this param is read literally, so the list is exactly what is
        # accepted and an unlabeled origin is no longer among it. Add
        # application/octet-stream to keep taking those, or set an empty list to
        # accept any type at all.
        # Default: audio/wav, audio/x-wav, audio/mpeg, audio/mp3, audio/flac,
        # audio/x-flac, audio/ogg, audio/opus, audio/webm.
        #
        # An input_audio part carries a format name, checked against one
        # canonical MIME type per format (audioFormatMIME in
        # pkg/coordinator/steps/replace_media_urls.go lists the pairs), so a
        # list omitting a format's canonical type rejects that format:
        # audio/mp3 alone does not admit "mp3", audio/mpeg does. The default
        # aliases (audio/x-wav, audio/mp3, audio/x-flac) only ever match a data
        # URI or a download's Content-Type.
        # allowed_audio_content_types:
        #   - audio/wav
        #   - audio/mpeg

        # allowed_video_content_types overrides the built-in video MIME
        # allowlist. Applies to video_url data URIs and to the Content-Type an
        # http(s) video_url origin returns; as with audio, the download path is
        # checked whether or not this param is set, an unlabeled download is
        # accepted while the param is unset, and setting it is read literally.
        # See allowed_audio_content_types for the reasoning.
        # Default: video/mp4, video/webm, video/quicktime, video/mpeg, video/ogg.
        # allowed_video_content_types:
        #   - video/mp4

        # allow_private_networks permits downloads whose resolved IP falls in
        # an RFC1918 private range (10/8, 172.16/12, 192.168/16). Loopback,
        # link-local (including the 169.254.169.254 cloud metadata endpoint),
        # CGNAT, and unique-local addresses stay blocked regardless. Enable
        # only when media origins are inside the cluster network.
        # Default false.
        # allow_private_networks: false

        # allowed_domains restricts downloads to an explicit set of hostnames.
        # When omitted or empty, any host that passes the IP checks above is
        # allowed. This is an ADDITIONAL filter, not a replacement: a host in
        # this list is still subject to the IP blocks, so listing "localhost"
        # or an internal hostname does NOT make it reachable unless the
        # resolved IP is also permitted (see allow_private_networks).
        #
        # An empty entry is refused at startup, as it is for the content-type
        # allowlists above: the list would be non-empty and match no host, so
        # every download would be refused by a line written to permit one.
        # allowed_domains:
        #   - images.example.com

    # -------------------------------------------------------------------
    # render: tokenizes the request via the rendering service and (for
    # chat-completions multimodal) populates each MultimodalEntry's Hash,
    # KwargsData, and Placeholder offset/length.
    # -------------------------------------------------------------------
    - type: render
      params:
        # address is the base URL of the rendering service. Required.
        address: "http://rendering-service:8080"

        # timeout caps a single render HTTP call.
        timeout: 30s

        # max_idle_conns_per_host caps the size of the keep-alive pool to the
        # rendering service.
        max_idle_conns_per_host: 100

        # idle_conn_timeout is how long an idle keep-alive connection survives
        # before the transport closes it.
        idle_conn_timeout: 90s

        # max_total_tokens rejects requests whose tokenized prompt exceeds
        # the limit. Counts both text and image-placeholder tokens. Enforced
        # in the chat-completions, responses, completions string, and
        # completions token-array paths. 0 (or omitted) = unlimited.
        # max_total_tokens: 32768

        # max_total_placeholder_tokens rejects requests whose summed image
        # placeholder length exceeds the limit. Only meaningful for
        # multimodal chat-completions and responses requests.
        # 0 (or omitted) = unlimited.
        # max_total_placeholder_tokens: 4096

    # -------------------------------------------------------------------
    # conditional-decode: optional shortcut for text-only chats. When
    # the request has no multimodal entries, the coordinator probes the
    # decode worker first. If the worker has the prompt cached, it
    # answers inline and encode/prefill are skipped. If not, the worker
    # returns HTTP 412 and the pipeline continues through encode/prefill/
    # decode as normal. Uncomment to enable.
    # -------------------------------------------------------------------
    # - type: conditional-decode

    # -------------------------------------------------------------------
    # encode: fans out one POST per multimodal entry to the encoder pods,
    # collects the EC handoff descriptors, and merges them into
    # RequestContext.ECTransferParams.
    # -------------------------------------------------------------------
    - type: encode
      params:
        # max_parallel bounds the per-request errgroup. Each goroutine
        # holds an in-flight encoder request (~1 MB per HD image on the
        # /inference/v1/generate path) - keep modest if your encoder pods
        # are GPU-bound or memory-tight.
        max_parallel: 8

        # use_openai_format=true sends the original chat-completions body
        # to the encoder (encoder re-preprocesses from image_url, ~16 KB
        # per HD image). false sends features.kwargs_data with the
        # pre-preprocessed tensor (~1 MB per HD image, no encoder CPU
        # cost). Inherits from gateway.use_openai_format if omitted.
        # use_openai_format: true

        # ec_connector overrides pipeline.ec_connector for this step only.
        # Rarely needed.
        # ec_connector: ec-nixl

    # -------------------------------------------------------------------
    # prefill: forwards the request (now annotated with EC and KV hints)
    # to a prefill pod selected by the EPP.
    # -------------------------------------------------------------------
    - type: prefill
      # params:
      #   use_openai_format mirrors gateway.use_openai_format but lets the
      #   step override per-pipeline if you want a different wire format
      #   for the text-only fast path.
      #   use_openai_format: true
      #   ec_connector: ec-nixl     # overrides pipeline.ec_connector
      #   kv_connector: kv-nixl     # overrides pipeline.kv_connector

    # -------------------------------------------------------------------
    # decode: streams the completion back to the client. Last step.
    # -------------------------------------------------------------------
    - type: decode
      # params:
      #   kv_connector: kv-nixl     # overrides pipeline.kv_connector
