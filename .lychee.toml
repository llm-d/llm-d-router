# Ignore transient failures on gnu.org (it sometimes refuses connections)
exclude = [
  "^https://www.gnu.org/software/make(/.*)?$",
  "^https://www.envoyproxy.io/",
  "^https://llm-d\\.slack\\.com/",
  "^https://meet\\.google\\.com/",
  "^https://docs\\.google\\.com/",
  "^https://drive\\.google\\.com/",
  "^https://app\\.fossa\\.com/"
]

# .github/copilot-instructions.md is a symlink to ../AGENTS.md (as is
# ./CLAUDE.md). GitHub dereferences the symlink for display so relative
# links resolve from AGENTS.md at the repo root; lychee reads the raw
# path and breaks on otherwise-correct links. Skip the duplicate.
exclude_path = [
  ".github/copilot-instructions.md",
]

# Per-request timeout in seconds. Sized for slow upstream docs sites
# (e.g. sigs.k8s.io subdomains under load); 20s was tight enough to fire
# spurious timeouts on otherwise-reachable links.
timeout = 60

# Retry settings. Lychee 0.24.2 (GHA 2.9.0) retries timeouts and connection reset or
# abort errors with exponential backoff. It does not retry 5xx responses,
# so those fail on the first response
# (https://github.com/lycheeverse/lychee/issues/2319). Worst-case per
# dead link with these values:
#   timeout * (max_retries + 1) + retry_wait_time * (2^max_retries - 1)
#   = 60 * 5 + 5 * 15 = 375s.
# Lychee runs link checks concurrently (default 128 parallel), so total
# wall-clock is bounded by the slowest single link, not the sum across
# all links. Four retries give slow hosts more time to recover.
max_retries = 4
retry_wait_time = 5

# Accept non-200 status codes (429: rate limits)
accept = [200, 429]
