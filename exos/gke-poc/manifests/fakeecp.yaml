# fake-ECP: control-node annotations -> headless Service + EndpointSlices.
# Rendered with envsubst (FAKEECP_IMAGE).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-ecp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fake-ecp-nodes
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fake-ecp-nodes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fake-ecp-nodes}
subjects:
- {kind: ServiceAccount, name: fake-ecp, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fake-ecp
  namespace: default
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fake-ecp
  namespace: default
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fake-ecp}
subjects:
- {kind: ServiceAccount, name: fake-ecp, namespace: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-ecp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-ecp}
  template:
    metadata:
      labels: {app: fake-ecp}
    spec:
      serviceAccountName: fake-ecp
      containers:
      - name: fake-ecp
        image: ${FAKEECP_IMAGE}
        args: ["--namespace=default", "--service=glm52-server", "--port=9080", "--interval=5s"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
